<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Το IonianDTwin είναι ένας γεωχωρικός Ψηφιακός Δίδυμος που μετρά συνεχώς τη βιωσιμότητα των Ιονίων Νήσων: οικοσυστήματα, ύδατα, ενέργεια, απόβλητα, βιοποικιλότητα και πολιτιστική κληρονομιά. Συγχρηματοδοτούμενο από την ΕΕ στο Πρόγραμμα «Ιόνια Νησιά» 2021–2027." />
    <meta name="description" lang="en" content="IonianDTwin is a geospatial Digital Twin that continuously measures the sustainability of the Ionian Islands: ecosystems, water, energy, waste, biodiversity and cultural heritage. EU co-funded under the Ionian Islands 2021–2027 programme." />
    <title>IonianDTwin — Ένα βιώσιμο Ιόνιο, μετρημένο σε πραγματικό χρόνο</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,300;1,8..60,400;1,8..60,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231E1D19'/%3E%3Cpath d='M6.5 10c3.1-2.4 6.4-2.4 9.5 0s6.4 2.4 9.5 0' stroke='%23C4633C' stroke-width='2.1' fill='none' stroke-linecap='round'/%3E%3Cpath d='M6.5 16c3.1-2.4 6.4-2.4 9.5 0s6.4 2.4 9.5 0' stroke='%23A9C3BF' stroke-width='2.1' fill='none' stroke-linecap='round'/%3E%3Cpath d='M6.5 22c3.1-2.4 6.4-2.4 9.5 0s6.4 2.4 9.5 0' stroke='%23FCFBF7' stroke-width='2.1' fill='none' stroke-linecap='round' opacity='.85'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Apply the saved palette + language before first paint to avoid a flash. */
      (function () {
        try {
          var p = localStorage.getItem("ioniandtwin.palette");
          var map = {
            ocean: { c: "#F5F8FA", i: "#0A1930", d: "#050C17" },
            emerald: { c: "#f9faf8", i: "#132a13", d: "#081c15" },
            clay: { c: "#f4f1e8", i: "#1e1d19", d: "#131210" },
          };
          var v = map[p] || map.clay;
          var s = document.documentElement.style;
          s.setProperty("--color-cream", v.c);
          s.setProperty("--color-ink", v.i);
          s.setProperty("--color-ink2", v.d);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
