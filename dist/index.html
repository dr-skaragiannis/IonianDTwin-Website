s:[{title:"Continuously refreshed view",desc:"Feeds arrive in near-real time — sensor telemetry, EO composites and citizen reports render as soon as the data lake updates."},{title:"Askable, exportable layers",desc:"Every overlay is toggleable, queryable and exportable from the screen itself — no separate download workflow."},{title:"Threshold-aware maps",desc:"Layers are nudged by the same policy thresholds that drive the platform's alerts — the map is the response plan, not a picture of it."},{title:"Today against the trend",desc:"Forecast panels and historical slices sit beside the live view, so current conditions are always read in context."}],rollTitle:"Every pixel rolls up to one number.",rollLede:"The dashboard's layers feed a composite Sustainability Index aligned with GSTC Destination Criteria v2.0.",rollBtn:"Explore the indicators"},mobile:{eyebrow:"Platform · D8",crumb:"Mobile App",titleA:"The twin, in",titleB:"every pocket.",lede:"An app for citizens and visitors that alerts you in time to what affects your everyday life — air and water quality, crowding and health warnings — and helps you make better decisions. Citizen contributions further strengthen the reliability of these alerts.",meta:["iOS · Android","Offline-first","Push alerts","WCAG 2.0 AA"],aEyebrow:"Alerts for everyday life",aTitleA:"Informed",aTitleB:"before everything.",aLede:"The app watches the places that matter to you — beaches, squares, neighbourhoods — and alerts you in advance, so you can protect your health and plan your day without surprises.",checks:["Real-time alerts for the places you care about — beaches, squares and neighbourhoods","Health warnings before they affect your day","Safer, lower-impact alternatives near you","Designed to WCAG 2.0 AA and Greek Law 4074/2012"],nEyebrow:"How it works",nTitle:"From an alert to a better decision.",nLede:"Receiving timely alerts turns information into a daily benefit for citizens and visitors alike.",steps:[{t:"Stay informed",d:"Receive uery",d:"The query runs against the twin's harmonised spatio-temporal store."},{n:"04",t:"Grounded answer out",d:"The LLM answers with real numbers, sources and confidence."}],tEyebrow:"Trust by design",tTitle:"Grounded, not improvised.",tLede:"An LLM is only useful in governance if it cannot invent. Three mechanisms keep the twin's answers honest.",trust:[{t:"RAG grounding",d:"LangChain / LlamaIndex ground the model in the platform's spatial schema and documentation — it answers from the twin, not from memory."},{t:"Validated NL-to-SQL",d:"Natural language compiles into schema-checked spatial queries. Numbers are computed by the database, never hallucinated by the model."},{t:"Source attribution",d:"Every figure traces back to its feed — sensors, CAMS, MarineTraffic — with timestamps and confidence attached."}],note:"At deployment the interface connects to the live data lake over the platform's API — the preview shows exactly how a trained answer will look."},indicators:{eyebrow:"Sustainability indicators",crumb:"Indicators",titleA:"34 indicators. 10 categories.",titleB:"One index.",lede:"The twin's measurement spine: every indicator carries real-time measurement, historical trend analysis and threshold-based alerting — aligned with the GSTC Destination Criteria v2.0.",meta:["GSTC v2.0 aligned","Threshold-based alerting","Historical trend analysis","Real-time measurement"],ciEyebrow:"The composite index",ciTitle:"A single number you can govern with.",ciLede:"Environmental, social and tourism-flow metrics fold into one AI-derived score — the region's vital sign, recomputed continuously.",ciNote:"Illustrative value · Corfu, peak season",ciGauge:"/ 100 · HIGH",ciLow:"0–40 low",ciWatch:"40–70 watch",ciAlert:"70–100 alert",steps:[{t:"Measure",d:"Every indicator carries a real-time measurement channel — sensor, satellite or statistical — with full historical depth."},{t:"Model",d:"ML models normalise, weight and correlate each indicator against tourism-flow and seasonality context."},{t:"Index",d:"The result folds into one composite Sustainability Index — comparable across sites, seasons and years."}],exEyebrow:"The ten categories",exTitle:"Every pressure, instrumented.",exLede:"Select a category to inspect its indicators, GSTC mapping and example threshold alert.",catCount:"Indicators",catStandard:"GSTC criterion",catThreshold:"Alert threshold",catMeasures:"What it measures",catRead:"How to read this",catProcess:"How the Digital Twin improves sustainability",catProcessText:"The Digital Twin turns this measurement into a management cycle: establish a baseline, compare the live value with the policy threshold, notify the responsible team when it is crossed, record the intervention, and verify whether the next measurement improves.",catDemo:"Demo",gEyebrow:"Standards alignment",gTitleA:"Aligned with",gTitleB:"GSTC v2.0.",gLede:"The Global Sustainable Tourism Council's Destination Criteria v2.0 define the international benchmark for sustainable destination management. The twin maps all 34 indicators onto its four pillars — making certification evidence a by-product of operation.",gBtn:"Read the GSTC criteria",alEyebrow:"From threshold to action",alTitle:"Alerts that reach someone.",alertSteps:[{n:"01",t:"Threshold breached",d:"An indicator crosses its policy threshold — e.g. an air-quality limit exceeded at a monitored site."},{n:"02",t:"Alert routed",d:"Email, push and SMS notifications reach the responsible municipal desk in seconds."},{n:"03",t:"Action logged",d:"Interventions are recorded against the alert — building the region's response evidence base."},{n:"04",t:"Policy refined",d:"Season-over-season alert analytics inform carrying-capacity and licensing policy."}],alertNote:"Every alert also surfaces in the mobile app — citizens become part of the response loop."},dataSources:{eyebrow:"Resources · Data ingestion",crumb:"Data Sources",titleA:"Twelve feeds.",titleB:"One data lake.",lede:"The twin's primary foundation is open web data and existing systems: orbit, sea, sky, road, tourism and citizen sources are harmonised into a single spatio-temporal data model with two levels of spatial resolution.",meta:["Satellite · EO","Maritime & aviation","Weather & traffic","Citizen reports"],scaleEyebrow:"Single model, two scales",scaleNote:"Every feed — orbit, sea, sky, road and citizen sources — folds into one spatio-temporal model at two resolutions: regional (macro) and per-island municipal (micro). The platform reads both scales from the same store.",scaleLink:"Explore the two scales",tbEyebrow:"Primary data feeds",tbTitle:"Where the data comes from.",tbLede:"Open, documented and API-accessible wherever possible — starting with Europe's own Copernicus services.",thSource:"Source",thType:"Type",thData:"Data provided",thAccess:"Access",note:"Ten indoor collection stations provide complementary local measurements. Where crowd observation is used, collection is privacy-preserving by design and no personal data is stored.",noteLink:"Architecture"},related:{eyebrow:"Resources · Ecosystem",crumb:"Related Projects",titleA:"Part of the",titleB:"European digital-twin ecosystem.",lede:"Local Digital Twins for tourism, heritage and sustainability form an active European field of research and innovation. IonianDTwin builds on this body of work and contributes to its continued development.",meta:["Interreg Euro-MED","Horizon Europe","ESA · DestinE","Corfu pilot project"],ey:"Ten related projects",title:"The European digital-twin ecosystem.",link:"Cited standards, papers & data providers"},references:{eyebrow:"Resources · Cited sources",crumb:"References",titleA:"Standards, papers &",titleB:"providers.",lede:"The twin is designed around public standards, open Copernicus data and peer-reviewed research. Everything the proposal builds on is listed here.",meta:["GSTC v2.0","WCAG 2.0","Peer-reviewed literature","Copernicus services"],gEyebrow:"Four groups",gTitle:"The full canon.",link:"Browse related projects",ack:"“The European Regional Development Fund and the Ionian Islands Programme 2021–2027 make this work possible.”",ackSrc:"IonianDTwin · OPS 6061866 · proposal phase"},contact:{eyebrow:"Contact",crumb:"Contact",titleA:"Talk to",titleB:"the consortium.",lede:"Questions about the proposal, partnership opportunities, piloting on your island, or press — the IonianDTwin team at Ionian University wants to hear from you.",meta:["Proposal phase","Response within 3 working days","Corfu · Greece"],formTag:"Send a message · form D-01",name:"Full name *",namePh:"Maria Konstantinou",email:"Email *",emailPh:"you@example.gr",org:"Organisation",orgPh:"Municipality of Corfu",topic:"Topic *",topicPh:"Select a topic…",topics:["Partnership / pilot participation","Municipality or region enquiry","Research collaboration","Citizen & visitor programme","Press & media","Other"],message:"Message *",messagePh:"Tell us about your island, your question, or how you'd like to be involved…",consent:"By sending, you consent to the consortium processing your data solely to respond to this enquiry (GDPR).",send:"Send message",sentTitle:"Message received.",sentBody:"Efcharistó! The consortium aims to reply within three working days. For urgent matters, write directly to",sentAgain:"Send another message",leadTag:"Consortium lead",leadName:"Ionian University",leadSub:"ELKE-IP — Special Account for Research Funds",leadAddr:"Corfu 491 00, Ionian Islands, Greece",leadReply:"Replies within 3 working days",authTag:"Managing authority",authName:"Ionian Islands Programme",authSub:"Operational Programme “Ionian Islands” 2021–2027",whoTag:"Who writes to us",audiences:[{t:"Municipalities & region",d:"Pilots, sensor hosting, dashboard access and indicator calibration for your island."},{t:"Researchers & academia",d:"Data partnerships, co-authored studies and thesis opportunities with Ionian University."},{t:"Citizens & visitors",d:"Early access to the mobile app pilot and community briefings on Corfu and beyond."}],dpoTag:"Data Protection",dpoTitle:"Your data & the DPO",dpoBody:"Data you share with the consortium is processed solely to respond to your enquiry, in accordance with the GDPR (Regulation (EU) 2016/679). For any matter concerning the processing of your personal data, or to exercise your rights under the GDPR, contact the Data Protection Officer (DPO) of Ionian University.",dpoLink:"Ionian University · Data Protection & Privacy",dpoUrl:"https://gdpr.ionio.gr/",faqEyebrow:"FAQ",faqTitle:"Asked often, answered here.",faqs:[{q:"When does IonianDTwin start?",a:"The project is currently in the proposal phase under the Ionian Islands Programme 2021–2027. The target start date is 1 January 2027, running for 33 months until 30 September 2029."},{q:"Can my municipality or island take part?",a:"Yes — the twin is designed for the whole region. Municipalities interested in hosting sensor stations, piloting the dashboard or shaping the indicator thresholds are encouraged to write to us; the consortium is finalising its partner list during the proposal phase."},{q:"Will the data be open?",a:"The platform is built on open standards (OGC services, open APIs) and public data sources like Copernicus. Aggregated, anonymised indicator data will be published openly; raw sensor and citizen-report data remain subject to GDPR safeguards."},{q:"How can citizens and visitors contribute?",a:"Through the mobile app's crowdsourcing layer — report pollution, habitat damage or accessibility barriers with a photo. Verified reports become part of the twin's live data and improve the models for everyone."}]},privacy:{eyebrow:"Legal · Privacy",crumb:"Privacy Policy",titleA:"Your privacy,",titleB:"taken seriously.",lede:"This Privacy Policy explains how the IonianDTwin consortium at Ionian University processes personal data in connection with this website and its contact forms, in accordance with the General Data Protection Regulation (Regulation (EU) 2016/679 — GDPR).",meta:["GDPR 679/2016","Ionian University","Data Protection Officer","Contact forms"],lastUpdated:"Last updated: August 2026",sections:[{title:"1. Data controller",body:"The data controller for the processing described in this policy is Ionian University (special account ELKE-IP), 7 Tsirigoti Square, Corfu 491 00, Greece — the lead partner of the IonianDTwin consortium."},{title:"2. Data we process",body:"When you use the website or contact forms, we may process the personal data you voluntarily provide, such as your name, email address, organisation and the content of your message. We process only the data necessary to respond to your enquiry. The website itself serves static content and does not require an account."},{title:"3. Purpose and legal basis",body:"Your data are processed solely to respond to your enquiry, to manage partnership and piloting requests, and to support research and innovation activities under the Ionian Islands Programme 2021–2027. The legal bases are your consent (Article 6(1)(a) of the GDPR) where you provide it, and the performance of tasks carried out in the public interest (Article 6(1)(e) of the GDPR)."},{title:"4. Retention",body:"Data are retained only for as long as necessary to fulfil the purpose for which they were collected, and thereafter in accordance with Ionian University's records-management policy and applicable legal obligations."},{title:"5. Your rights",body:"Under the GDPR you have the right to access, rectify, erase and restrict the processing of your personal data, the right to data portability, the right to object, and — where processing is based on consent — the right to withdraw consent at any time. You also have the right to lodge a complaint with the Hellenic Data Protection Authority (dpa.gr)."},{title:"6. Data Protection Officer",body:"For any matter concerning the processing of your personal data, or to exercise your rights under the GDPR, you may contact the Data Protection Officer (DPO) of Ionian University through the official personal-data portal."}],cookiesTitle:"7. Cookies and scripts",cookiesIntro:"This website is deliberately lightweight. We do not use advertising, analytics or other tracking cookies, and we do not set any cross-site tracking scripts. The only data stored or transferred on your device are listed below, with full transparency.",cookies:[{name:"ioniandtwin.lang",type:"localStorage",purpose:"Remembers your chosen language (Greek or English) so the site renders in your preferred language on every visit.",data:"Language preference only"},{name:"ioniandtwin.palette",type:"localStorage",purpose:"Remembers your selected colour theme so the appearance is consistent across visits.",data:"Theme name only"}],cookieNote:"localStorage entries are stored locally in your browser and are never transmitted to our servers. They contain only a language or theme preference and no personal or identifying data. You can clear them at any time through your browser's settings.",scriptHeading:"Scripts and external resources",scripts:[{name:"Google Fonts",layer:"Third-party",purpose:"Serves the typography (Source Serif 4, Instrument Sans, IBM Plex Mono) used on the site. Your device requests the font files from Google's servers, which may see your IP address.",provider:"Google Fonts / fonts.googleapis.com"},{name:"Map tiles (CARTO / OpenStreetMap)",layer:"Third-party",purpose:"Loads the interactive basemap tiles for the Digital Twin map. Your device requests tile images from the CARTO CDN, which may see your IP address and the tiles you view.",provider:"basemaps.cartocdn.com / openstreetmap.org"},{name:"Contact form",layer:"First-party",purpose:"Collects the data you submit (name, email, organisation, message) solely to respond to your enquiry. No data is stored in cookies or sent to third parties.",provider:"IonianDTwin consortium"}],scriptNote:"No advertising, analytics, remarketing or social-media scripts are loaded by this website. The contact form is processed manually by the consortium and is not linked to any analytics platform.",dpoLink:"Contact the Data Protection Officer of Ionian University",dpoUrl:"https://gdpr.ionio.gr/"},notFound:{tag:"404 · Off the chart",titleA:"The page",titleB:"was not found.",lede:"The page you are looking for does not exist or is no longer available. Return to the home page to continue browsing.",back:"Back to home",contact:"Contact us"},dash:{sustainability:"Sustainability index",watch:"Watch",indicators:"34 indicators",categories:"10 categories",updated:"Updated 12 s ago",aqi:"Air quality index",crowd:"Crowd index · Corfu",seaTemp:"Ionian sea temp",alerts:"Active alerts",forecast:"Sustainability outlook · 14-day AI forecast",observed:"observed",forecasted:"forecast",confidence:"confidence",sources:"Sources · sensors · CAMS · MarineTraffic · Flightradar24",intensity:"Indicator intensity",low:"LOW",watchLow:"WATCH",alert:"ALERT",disclaimer:"Simulated preview · illustrative data — basemap © OpenStreetMap · CARTO",layers:{environment:"Environmental",transport:"Transport",infrastructure:"Infrastructure"},islandLabels:["CORFU","PAXI","LEFKADA","KEFALONIA","ITHACA","ZAKYNTHOS","KITHIRA"],today:"TODAY"},llm:{title:"Twin Intelligence",sub:"RAG → NL-to-SQL → data lake",preview:"D7 · preview",greeting:"Kalimera. I'm the twin's natural-language interface — ask me anything about the environment, ecosystems or outlook of the Ionian Islands.",thinking:"Consulting the data lake…",placeholder:"Ask about air quality, ecosystems, forecasts…",send:"Send",fallback:"At deployment, this interface will run a live RAG pipeline over the platform's data lake — translating natural language to SQL. In this preview, try one of the suggested questions to see how a trained answer looks.",qa:[{q:"Which sites exceeded environmental thresholds this week?",a:"Three monitored zones exceeded their thresholds in the last 7 days. Glyfada (Corfu) peaked at 118% of its carrying capacity on 9 August; Paleokastritsa remained above threshold for 3 consecutive days; Navagi "},references:{eyebrow:"Πόροι · Παραπομπές",crumb:"Βιβλιογραφία",titleA:"Πρότυπα, δημοσιεύσεις &",titleB:"πηγές δεδομένων.",lede:"Το δίδυμο σχεδιάστηκε γύρω από δημόσια πρότυπα, ανοιχτά δεδομένα Copernicus και κριτικά αξιολογημένη έρευνα. Όλα στα οποία βασίζεται η πρόταση παρατίθενται εδώ.",meta:["GSTC v2.0","WCAG 2.0","Κριτικά αξιολογημένη βιβλιογραφία","Υπηρεσίες Copernicus"],gEyebrow:"Τέσσερις ενότητες",gTitle:"Το πλήρες σώμα τεκμηρίωσης.",link:"Προβολή συναφών έργων",ack:"“Το Ευρωπαϊκό Ταμείο Περιφερειακής Ανάπτυξης και το Πρόγραμμα «Ιόνια Νησιά» 2021–2027 καθιστούν δυνατό αυτό το έργο.”",ackSrc:"IonianDTwin · Κωδ. OPS 6061866 · φάση πρότασης"},contact:{eyebrow:"Επικοινωνία",crumb:"Επικοινωνία",titleA:"Επικοινωνήστε με",titleB:"την κοινοπραξία.",lede:"Ερωτήσεις για την πρόταση, δυνατότητες συνεργασίας, πιλοτική εφαρμογή στο νησί σας ή θέματα Τύπου — η ομάδα του IonianDTwin στο Ιόνιο Πανεπιστήμιο επιθυμεί να σας ακούσει.",meta:["Φάση πρότασης","Απάντηση εντός 3 εργάσιμων ημερών","Κέρκυρα · Ελλάδα"],formTag:"Αποστολή μηνύματος · φόρμα D-01",name:"Ονοματεπώνυμο *",namePh:"Μαρία Κωνσταντίνου",email:"Ηλεκτρονική διεύθυνση *",emailPh:"you@example.gr",org:"Οργανισμός",orgPh:"Δήμος Κέρκυρας",topic:"Θέμα *",topicPh:"Επιλέξτε θέμα…",topics:["Συνεργασία / συμμετοχή σε πιλοτική εφαρμογή","Ερώτημα δήμου ή περιφέρειας","Ερευνητική συνεργασία","Πρόγραμμα πολιτών & επισκεπτών","Τύπος και μέσα ενημέρωσης","Άλλο"],message:"Μήνυμα *",messagePh:"Πείτε μας για το νησί σας, την ερώτησή σας ή πώς θα θέλατε να συμμετάσχετε…",consent:"Με την αποστολή συναινείτε στην επεξεργασία των δεδομένων σας αποκλειστικά για την απάντηση σε αυτό το αίτημα (GDPR).",send:"Αποστολή μηνύματος",sentTitle:"Το μήνυμα ελήφθη.",sentBody:"Ευχαριστούμε! Η κοινοπραξία στοχεύει σε απάντηση εντός τριών εργάσιμων ημερών. Για επείγοντα, απευθυνθείτε απευθείας στο",sentAgain:"Αποστολή άλλου μηνύματος",leadTag:"Φορέας Υλοποίησης",leadName:"Ιόνιο Πανεπιστήμιο",leadSub:"ΕΛΚΕ — Ειδικός Λογαριασμός Κονδυλίων Έρευνας",leadAddr:"Κέρκυρα 491 00, Ιόνια Νησιά, Ελλάδα",leadReply:"Απάντηση εντός 3 εργάσιμων ημερών",authTag:"Αρμόδια αρχή",authName:"Πρόγραμμα Ιονίων Νήσων",authSub:"Επιχειρησιακό Πρόγραμμα «Ιόνια Νησιά» 2021–2027",whoTag:"Σε ποιους απευθυνόμαστε",audiences:[{t:"Δήμοι & περιφέρεια",d:"Πιλοτικές εφαρμογές, φιλοξενία αισθητήρων, πρόσβαση στον πίνακα ελέγχου και βαθμονόμηση δεικτών για το νησί σας."},{t:"Ερευνητές & ακαδημαϊκή κοινότητα",d:"Συνεργασίες δεδομένων, από κοινού δημοσιεύσεις και ευκαιρίες εκπόνησης διπλωματικών με το Ιόνιο Πανεπιστήμιο."},{t:"Πολίτες & επισκέπτες",d:"Πρόωρη πρόσβαση στο πιλοτικό πρόγραμμα της εφαρμογής και ενημερωτικές συναντήσεις στην Κέρκυρα και όχι μόνο."}],dpoTag:"Προστασία Δεδομένων",dpoTitle:"Τα δεδομένα σας & ο ΥΠΔ",dpoBody:"Τα δεδομένα που μοιράζεστε με την κοινοπραξία επεξεργάζονται αποκλειστικά για την απάντηση στο αίτημά σας, σύμφωνα με τον ΓΚΠΔ (Κανονισμός (ΕΕ) 2016/679). Για κάθε θέμα που αφορά την επεξεργασία των προσωπικών σας δεδομένων ή για την άσκηση των δικαιωμάτων σας δυνάμει του ΓΚΠΔ, επικοινωνήστε με τον Υπεύθυνο Προστασίας Δεδομένων (ΥΠΔ) του Ιονίου Πανεπιστημίου.",dpoLink:"Ιόνιο Πανεπιστήμιο · Προστασία Δεδομένων & Ιδιωτικότητα",dpoUrl:"https://gdpr.ionio.gr/",faqEyebrow:"Συχνές ερωτήσεις",faqTitle:"Συχνές ερωτήσεις, με απαντήσεις εδώ.",faqs:[{q:"Πότε ξεκινά το IonianDTwin;",a:"Το έργο βρίσκεται επί του παρόντος σε φάση πρότασης στο Πρόγραμμα «Ιόνια Νησιά» 2021–2027. Η στοχευμένη ημερομηνία έναρξης είναι η 1η Ιανουαρίου 2027, με διάρκεια 33 μήνες έως τις 30 Σεπτεμβρίου 2029."},{q:"Μπορεί ο δήμος ή το νησί μου να συμμετάσχει;",a:"Ναι — το δίδυμο σχεδιάστηκε για ολόκληρη την περιφέρεια. Δήμοι που ενδιαφέρονται να φιλοξενήσουν σταθμούς αισθητήρων, να εφαρμόσουν πιλοτικά τον πίνακα ελέγχου ή να διαμορφώσουν τα κατώφλια των δεικτών προσκαλούνται να επικοινωνήσουν. Η κοινοπραξία ολοκληρώνει τον κατάλογο εταίρων στη φάση της πρότασης."},{q:"Τα δεδομένα θα είναι ανοιχτά;",a:"Η πλατφόρμα βασίζεται σε ανοιχτά πρότυπα (υπηρεσίες OGC, ανοιχτά API) και δημόσιες πηγές όπως το Copernicus. Τα συγκεντρωτικά, ανωνυμοποιημένα δεδομένα δεικτών θα δημοσιευτούν ανοιχτά. Τα ακατέργαστα δεδομένα αισθητήρων και αναφορών πολιτών παραμένουν υπό τους μηχανισμούς προστασίας του GDPR."},{q:"Πώς μπορούν να συνεισφέρουν οι πολίτες και οι επισκέπτες;",a:"Μέσω του επιπέδου συμμετοχικής καταγραφής της εφαρμογής κινητού — αναφέρετε ρύπανση, καταστροφή οικοτόπου ή εμπόδιο προσβασιμότητας με μια φωτογραφία. Οι επαληθευμένες αναφορές γίνονται μέρος των ζωντανών δεδομένων του διδύμου και βελτιώνουν τα μοντέλα για όλους."}]},privacy:{eyebrow:"Νομικά · Απόρρητο",crumb:"Πολιτική Απορρήτου",titleA:"Η ιδιωτικότητά σας",titleB:"λαμβάνεται στα σοβαρά.",lede:"Η παρούσα Πολιτική Απορρήτου εξηγεί τον τρόπο με τον οποίο η κοινοπραξία IonianDTwin στο Ιόνιο Πανεπιστήμιο επεξεργάζεται προσωπικά δεδομένα σε σχέση με τον παρόντα ιστότοπο και τις φόρμες επικοινωνίας, σύμφωνα με τον Γενικό Κανονισμό Προστασίας Δεδομένων (Κανονισμός (ΕΕ) 2016/679 — ΓΚΠΔ).",meta:["ΓΚΠΔ 679/2016","Ιόνιο Πανεπιστήμιο","Υπεύθυνος Προστασίας Δεδομένων","Φόρμες επικοινωνίας"],lastUpdated:"Τελευταία ενημέρωση: Αύγουστος 2026",sections:[{title:"1. Υπεύθυνος επεξεργασίας",body:"Υπεύθυνος επεξεργασίας για τις επεξεργασίες που περιγράφονται στην παρούσα πολιτική είναι το Ιόνιο Πανεπιστήμιο (ειδικός λογαριασμός ΕΛΚΕ), Πλατεία Τσιριγώτη 7, Κέρκυρα 491 00, Ελλάδα — επικεφαλής εταίρος της κοινοπραξίας IonianDTwin."},{title:"2. Δεδομένα που επεξεργαζόμαστε",body:"Κατά τη χρήση του ιστοτόπου ή των φορμών επικοινωνίας, ενδέχεται να επεξεργαζόμαστε τα προσωπικά δεδομένα που παρέχετε οικειοθελώς, όπως το ονοματεπώνυμο, τη διεύθυνση ηλεκτρονικού ταχυδρομείου, τον οργανισμό και το περιεχόμενο του μηνύματός σας. Επεξεργαζόμαστε μόνο τα απαραίτητα δεδομένα για την απάντηση στο αίτημά σας. Ο ιστότοπος προβάλλει στατικό περιεχόμενο και δεν απαιτεί λογαριασμό."},{title:"3. Σκοπός και νομική βάση",body:"Τα δεδομένα σας επεξεργάζονται αποκλειστικά για την απάντηση στο αίτημά σας, τη διαχείριση αιτημάτων συνεργασίας και πιλοτικής εφαρμογής, καθώς και για την υποστήριξη ερευνητικών και καινοτόμων δραστηριοτήτων στο Πρόγραμμα «Ιόνια Νησιά» 2021–2027. Νομικές βάσεις αποτελούν η συγκατάθεσή σας (άρθρο 6 παρ. 1(α) ΓΚΠΔ) όπου αυτή παρέχεται, και η εκτέλεση καθηκόντων προς το δημόσιο συμφέρον (άρθρο 6 παρ. 1(ε) ΓΚΠΔ)."},{title:"4. Περίοδος διατήρησης",body:"Τα δεδομένα διατηρούνται μόνο για το διάστημα που απαιτείται για την επίτευξη του σκοπού για τον οποίο συλλέχθηκαν και στη συνέχεια σύμφωνα με την πολιτική τήρησης αρχείων του Ιονίου Πανεπιστημίου και τις ισχύουσες έννομες υποχρεώσεις."},{title:"5. Τα δικαιώματά σας",body:"Δυνάμει του ΓΚΠΔ έχετε δικαίωμα πρόσβασης, διόρθωσης, διαγραφής και περιορισμού της επεξεργασίας των προσωπικών σας δεδομένων, δικαίωμα φορητότητας, δικαίωμα εναντίωσης και — όταν η επεξεργασία βασίζεται στη συγκατάθεση — δικαίωμα ανάκλησης της συγκατάθεσης ανά πάσα στιγμή. Έχετε επίσης δικαίωμα υποβολής καταγγελίας στην Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα (dpa.gr)."},{title:"6. Υπεύθυνος Προστασίας Δεδομένων",body:"Για κάθε θέμα που αφορά την επεξεργασία των προσωπικών σας δεδομένων ή για την άσκηση των δικαιωμάτων σας δυνάμει του ΓΚΠΔ, μπορείτε να επικοινωνήσετε με τον Υπεύθυνο Προστασίας Δεδομένων (ΥΠΔ) του Ιονίου Πανεπιστημίου, μέσω της επίσημης διαδικτυακής πύλης προστασίας προσωπικών δεδομένων."}],cookiesTitle:"7. Cookies και scripts",cookiesIntro:"Αυτός ο ιστότοπος είναι εσκεμμένα ελαφρύς. Δεν χρησιμοποιούμε cookies διαφήμισης, αναλυτικής ή άλλου τύπου ιχνηλάτησης, και δεν περιλαμβάνονται cross-site scripts παρακολούθησης. Τα μόνα δεδομένα που αποθηκεύονται ή μεταφέρονται στη συσκευή σας παρατίθενται παρακάτω, με πλήρη διαφάνεια.",cookies:[{name:"ioniandtwin.lang",type:"localStorage",purpose:"Θυμάται την επιλεγμένη γλώσσα (ελληνικά ή αγγλικά) ώστε ο ιστότοπος να εμφανίζεται στην προτιμώμενη γλώσσα σας σε κάθε επίσκεψη.",data:"Μόνο προτίμηση γλώσσας"},{name:"ioniandtwin.palette",type:"localStorage",purpose:"Θυμάται το επιλεγμένο χρωματικό θέμα ώστε η εμφάνιση να παραμένει σταθερή μεταξύ των επισκέψεων.",data:"Μόνο όνομα θέματος"}],cookieNote:"Οι καταχωρήσεις localStorage αποθηκεύονται τοπικά στον browser σας και δεν μεταδίδονται ποτέ στους διακομιστές μας. Περιέχουν μόνο προτίμηση γλώσσας ή θέματος και κανένα προσωπικό ή ταυτοποιητικό δεδομένο. Μπορείτε να τις διαγράψετε ανά πάσα στιγμή μέσω των ρυθμίσεων του browser σας.",scriptHeading:"Scripts και εξωτερικοί πόροι",scripts:[{name:"Google Fonts",layer:"Τρίτο μέρος",purpose:"Εξυπηρετεί τις γραμματοσειρές (Source Serif 4, Instrument Sans, IBM Plex Mono) που χρησιμοποιούνται στον ιστότοπο. Η συσκευή σας ζητά τα αρχεία γραμματοσειρών από τους διακομιστές της Google, οι οποίοι ενδέχεται να δουν τη διεύθυνση IP σας.",provider:"Google Fonts / fonts.googleapis.com"},{name:"Χάρτες (CARTO / OpenStreetMap)",layer:"Τρίτο μέρος",purpose:"Φορτώνει τα διαδραστικά tiles του βασικού χάρτη για τον χάρτη του Ψηφιακού Διδύμου. Η συσκευή σας ζητά εικόνες tiles από το CDN της CARTO, το οποίο ενδέχεται να δει τη διεύθυνση IP σας και τα tiles που προβάλλετε.",provider:"basemaps.cartocdn.com / openstreetmap.org"},{name:"Φόρμα επικοινωνίας",layer:"Πρώτο μέρος",purpose:"Συλλέγει τα δεδομένα που υποβάλλετε (ονοματεπώνυμο, email, οργανισμός, μήνυμα) αποκλειστικά για την απάντηση στο αίτημά σας. Δεν αποθηκεύονται δεδομένα σε cookies ούτε διαβιβάζονται σε τρίτους.",provider:"Κοινοπραξία IonianDTwin"}],scriptNote:"Δεν φορτώνονται scripts διαφήμισης, αναλυτικής, remarketing ή κοινωνικών δικτύων σε αυτόν τον ιστότοπο. Η φόρμα επικοινωνίας εξυπηρετείται χειροκίνητα από την κοινοπραξία και δεν συνδέεται με καμία πλατφόρμα αναλυτικής.",dpoLink:"Επικοινωνία με τον Υπεύθυνο Προστασίας Δεδομένων του Ιονίου Πανεπιστημίου",dpoUrl:"https://gdpr.ionio.gr/"},notFound:{tag:"404 · Εκτός χάρτη",titleA:"Η σελίδα",titleB:"δεν βρέθηκε.",lede:"Η σελίδα που αναζητάτε δεν υπάρχει ή το αντικείμενό της δεν είναι πλέον διαθέσιμο. Επιστρέψτε στην αρχική σελίδα για να συνεχίσετε την πλοήγησή σας.",back:"Επιστροφή στην αρχική",contact:"Επικοινωνία"},dash:{sustainability:"Δείκτης βιωσιμότητας",watch:"Προσοχή",indicators:"34 δείκτες",categories:"10 κατηγορίες",updated:"Ενημερώθηκε 12 δευτ. πριν",aqi:"Δείκτης ποιότητας αέρα",crowd:"Δείκτης πλήθους · Κέρκυρα",seaTemp:"Θερμοκρασία Ιονίου",alerts:"Ενεργές ειδοποιήσεις",forecast:"Προοπτική βιωσιμότητας · πρόβλεψη 14 ημερών",observed:"παρατηρημένο",forecasted:"πρόβλεψη",confidence:"βεβαιότητα",sources:"Πηγές · αισθητήρες · CAMS · MarineTraffic · Flightradar24",intensity:"Ένταση δείκτη",low:"ΧΑΜΗΛΟ",watchLow:"ΠΡΟΣΟΧΗ",alert:"ΣΥΝΑΓΕΡΜΟΣ",disclaimer:"Προσομοιωμένη προεπισκόπηση · ενδεικτικά δεδομένα — βασικός χάρτης © OpenStreetMap · CARTO",layers:{environment:"Περιβάλλον",transport:"Μεταφορές",infrastructure:"Υποδομές"},islandLabels:["ΚΕΡΚΥΡΑ","ΠΑΞΟΙ","ΛΕΥΚΑΔΑ","ΚΕΦΑΛΟΝΙΑ","ΙΘΑΚΗ","ΖΑΚΥΝΘΟΣ","ΚΥΘΗΡΑ"],today:"ΣΗΜΕΡΑ"},llm:{title:"Νοημοσύνη Διδύμου",sub:"RAG → NL-to-SQL → λίμνη δεδομένων",preview:"D7 · προεπισκόπηση",greeting:"Καλημέρα. Είμαι η διεπαφή φυσικής γλώσσας του διδύμου — ρωτήστε με ο,τιδήποτε για το περιβάλλον, τα οικοσυστήματα ή την προοπτική των Ιονίων Νήσων.",thinking:"Αναζήτηση στη λίμνη δεδομένων…",placeholder:"Ρωτήστε για ποιότητα αέρα, οικοσυστήματα, προβλέψεις…",send:"Αποστολή",fallback:"Κατά την ανάπτυξη, αυτή η διεπαφή θα εκτελεί ζωντανό αγωγό RAG πάνω στη λίμνη δεδομένων της πλατφόρμας — μεταφράζοντας τη φυσική γλώσσα σε SQL. Σε αυτή την προεπισκόπηση, δοκιμάστε μία από τις προτεινόμενες ερωτήσεις για να δείτε πώς μοιάζει μια εκπαιδευμένη απάντηση.",qa:[{q:"Ποιες τοποθεσίες υπέρβασαν περιβαλλοντικά κατώφλια αυτή την εβδομάδα;",a:"Τρεις παρακολουθούμενες ζώνες υπέρβασαν τα κατώφλιά τους τις τελευταίες 7 ημέρες. Η Γλυφάδα (Κέρκυρα) έφτασε στο 118% της φέρουσας ικανότητάς της στις 9 Αυγούστου. Η Παλαιοκαστρίτσα παρέμεινε πάνω από το κατώφλι για 3 συνεχείς ημέρες, ενώ το Ναυάγιο (Ζάκυνθος) ξεπέρασε το 96% μία φορά. Προτείνω στοχευμένες παρεμβάσεις μέσω της ροής εναλλακτικών δραστηριοτήτων της εφαρμογής.",stats:[{k:"Μέγιστο Γλυφάδας",v:"118%"},{k:"Ημέρες ζώνης πάνω από κατώφλι",v:"9"},{k:"Ενεργά σημεία",v:"3"}],sources:["Αισθητήρες πλήθους","Sentinel-1 SAR","Αναφορές πολιτών"]},{q:"Πώς εξελίσσεται η ποιότητα του αέρα στην πόλη της Κέρκυρας;",a:"Βελτιώνεται σε σχέση με τον Ιούλιο. Τα PM10 μειώθηκαν κατά 12% σε μηνιαία βάση (31 → 27 µg/m³), το NO₂ παραμένει στα 19 µg/m³ και το όζον εντός των ευρωπαϊκών στόχων. Ο σύνθετος δείκτης AQI ανέρχεται σε 41, δηλαδή σε μέτριο επίπεδο. Το μοντέλο μηχανικής μάθησης αποδίδει περίπου το 38% της διακύμανσης στην κυκλοφορία (R² = 0.38).",stats:[{k:"Μεταβολή PM10",v:"−12%"},{k:"Σύνθετος AQI",v:"41/100"},{k:"R² κυκλοφορίας",v:"0.38"}],sources:["Αισθητήρες αέρα IoT","Copernicus CAMS","OpenWeather"]},{q:"Ποια είναι η περιβαλλοντική προοπτική για την Κεφαλονιά το προσεχές σαββατοκύριακο;",a:"Αυξημένη πίεση — σύνθετος δείκτης 0.71, ζώνη προσοχής. Οι αφίξεις προβλέπονται αυξημένες κατά 14% σε εβδομαδιαία βάση, με 12 προγραμματισμένα πλοία και περίπου 38 καθημερινές πτήσεις. Προτεινόμενες ενέργειες: προκατανομή μέσων συλλογής αποβλήτων στο Αργοστόλι και ενίσχυση της παρακολούθησης στη Μύρτο.",stats:[{k:"Δείκτης πίεσης",v:"0.71"},{k:"Μεταβολή αφίξεων εβδ.",v:"+14%"},{k:"Πλοία · πτήσεις/ημέρα",v:"12 · 38"}],sources:["MarineTraffic","Flightradar24","Πρόβλεψη ΜΜ"]},{q:"Συγκρίνετε τη βιωσιμότητα στα επτά νησιά.",a:"Σύνθετες βαθμολογίες βιωσιμότητας: Ιθάκη 0.81, Κύθηρα 0.78, Παξοί 0.74, Κεφαλονιά 0.66, Λευκάδα 0.63, Ζάκυνθος 0.55, Κέρκυρα 0.48. Η βαθμολογία της Κέρκυρας επηρεάζεται από τους δείκτες πλήθους και αποβλήτων, ενώ της Ζακύνθου από τη θολότητα των παράκτιων υδάτων στο Ναυάγιο.",stats:[{k:"Καλύτερη · Ιθάκη",v:"0.81"},{k:"Χειρότερη · Κέρκυρα",v:"0.48"},{k:"Κατηγορίες GSTC",v:"10"}],sources:["Δείκτης GSTC v2.0","Και οι 12 πηγές"]}]}},m1=[{name:"Ithaca",greek:"Ithaki",score:81,note:"Low-impact seasonality and strong community stewardship of heritage assets"},{name:"Kythira",greek:"Kythera",score:78,note:"Remote sentinel of the network — rich in renewable-energy potential and native habitat"},{name:"Paxi",greek:"Paxos",score:74,note:"Compact land mass rewards careful visitor distribution and marine protection"},{name:"Kefalonia",greek:"Kefalonia",score:66,note:"Dispersed seasonality supports balance; protected Caretta-caretta nesting sites monitored"},{name:"Lefkada",greek:"Lefkada",score:63,note:"Coastal dune and Posidonia meadow conservation alongside managed beach access"},{name:"Zakynthos",greek:"Zakynthos",score:55,note:"Marine protected areas around Navagio and Laganas under active restoration focus"},{name:"Corfu",greek:"Kerkyra",score:48,note:"Regional flagship pilot — the largest opportunity to demonstrate measurable improvement"}],p1=[{icon:yc,title:"Nature & ecosystems",body:"Posidonia seagrass meadows, coastal dunes and maquis habitat that anchor the islands' identity — monitored for extent, condition and disturbance so protection can be targeted, not blanket.",impact:"Conservation that adapts"},{icon:nh,title:"Water resources",body:"A Mediterranean island reality: scarce supply meeting peak seasonal demand. The twin tracks quality, turbidity and abstraction to keep bathing and drinking water within safe limits.",impact:"Resources kept in balance"},{icon:oh,title:"Energy & carbon",body:"Abundant sun and wind meet a demand curve that spikes each summer. Measuring the renewable share and the shape of that peak is the first step to flattening it.",impact:"A credible path to net zero"},{icon:rh,title:"Waste & circularity",body:"Per-visitor waste, recycling rates and single-use plastics, measured honestly — so circular-economy investment can be directed where it actually moves the number.",impact:"Less, reused, recovered"},{icon:eh,title:"Biodiversity",body:"Sentinel-2 vegetation indices, habitat disturbance alerts and invasive-species signals give the region an early-warning system for the ecosystems that underpin its economy.",impact:"Early warning, not hindsight"},{icon:kr,title:"Culture & community",body:"Living heritage, historic town cores and the residents who sustain them. Sustainability is only real when the benefit stays local and the place keeps its character.",impact:"Benefit that stays local"}],g1=[{n:"01",title:"Build the Digital Twin",body:"A multi-layer geospatial twin integrating environmental, transport and digital-infrastructure monitoring for the entire Ionian region."},{n:"02",title:"Integrate open and system data",body:"Combine open web data, Earth Observation and existing maritime, aviation, weather and traffic systems. Ten indoor collection stations provide complementary local measurements."},{n:"03",title:"Fuse heterogeneous data",body:"Satellite (Copernicus), maritime (MarineTraffic), aviation (FlightRadar24), weather, traffic and crowdsourced citizen reports — one data lake."},{n:"04",title:"Model with ML/AI",body:"Predictive analytics, anomaly detection and tourism-flow forecasting that link visitor activity to environmental outcomes."},{n:"05",title:"Democratise access via LLM",body:"A natural-language interface that lets any stakeholder query the twin conversationally — no GIS expertise required."},{n:"06",title:"Measure what matters",body:"34 sustainability indicators across 10 categories, aligned with GSTC Destination Criteria v2.0."},{n:"07",title:"Put it in every pocket",body:"A mobile app for citizens and visitors: real-time alerts, crowdsourcing and alternative-activity recommendations."},{n:"08",title:"Leave no one behind",body:"WCAG 2.0 Level AA and Greek Law 4074/2012 accessibility compliance across every digital touchpoint."}],y1=[{id:"presentation",index:"05",name:"Presentation Layer",tag:"Where people meet the twin",desc:"Three coordinated front doors into the platform: a full GIS web dashboard for analysts and policymakers, a mobile companion for citizens and visitors, and a conversational LLM interface for everyone else.",components:[{name:"Web Dashboard",desc:"GIS maps, heatmaps, layered overlays and trend analytics in the browser."},{name:"Mobile App",desc:"iOS/Android companion with alerts, crowdsourcing and offline-first design."},{name:"LLM Query Interface",desc:"Natural-language questions translated to SQL against the data lake."}],tech:["React / Vue","Mapbox GL · Leaflet","D3 · Chart.js","React Native / Flutter"]},{id:"analytics",index:"04",name:"Analytics Layer",tag:"Where data becomes foresight",desc:"The intelligence of the twin: machine-learning models that detect anomalies, forecast conditions, and compute the composite Sustainability Index against GSTC v2.0.",components:[{name:"ML Models",desc:"Anomaly detection and supervised learning over fused environmental–tourism data."},{name:"Predictive Analytics",desc:"Time-series forecasting of visitor pressure, pollution and infrastructure load."},{name:"GSTC v2.0 Index",desc:"Composite index computation across 34 indicators and 10 categories."}],tech:["scikit-learn","TensorFlow / PyTorch","Prophet · time-series","Hugging Face"]},{id:"processing",index:"03",name:"Data Processing Layer",tag:"Where streams become structure",desc:"Real-time stream processing alongside batch ETL, with spatial analytics served through PostGIS and GeoServer into every client.",components:[{name:"Stream Processing",desc:"Continuous ingestion and windowing of high-frequency feeds from open services, existing systems and complementary local measurements."},{name:"ETL / Batch",desc:"Cleansing, harmonising and joining slower statistical and satellite sources."},{name:"Spatial Analytics",desc:"PostGIS geometry operations and OGC services via GeoServer."}],tech:["Apache Kafka","Apache Spark","Apache Flink","PostGIS · GeoServer"]},{id:"ingestion",index:"02",name:"Data Ingestion Layer",tag:"Where the world streams in",desc:"Twelve heterogeneous feeds — open web services, orbit, sea, sky, road and citizen sources — normalised into a single spatio-temporal data model.",components:[{name:"Earth Observation",desc:"Copernicus CAMS, CMEMS, Sentinel-1 SAR and Sentinel-2 optical."},{name:"Mobility Feeds",desc:"PeopleFlows movement data, MarineTraffic vessel positions, FlightRadar24 arrivals and Google traffic."},{name:"Citizen & Official",desc:"Crowdsourced reports from the mobile app, EU Tourism Dashboard statistics."}],tech:["MQTT broker","LoRaWAN server","REST / API connectors","Copernicus CDSE"]},{id:"physical",index:"01",name:"Data Collection / Sensor Layer",tag:"Where the twin touches ground",desc:"Open web data and existing systems form the primary foundation of the twin. Ten indoor collection stations provide complementary local observations for selected air-quality, water-quality and crowd-density indicators.",components:[{name:"Open and system data",desc:"Public web sources, Earth Observation, maritime, aviation, weather and traffic systems provide the main data foundation."},{name:"Ten indoor collection stations",desc:"Complementary local observations for selected air-quality, water-quality and crowd-density indicators."},{name:"Privacy-preserving observations",desc:"Aggregated measurements and carefully governed collection methods support the twin without storing personal data."}],tech:["Battery + photovoltaic","NB-IoT / LoRaWAN","Edge processing","IP-protected optics"]}],x1=[{id:"air",name:"Air Quality",icon:cg,color:"#c4633c",gstc:"D(c) Waste & Emissions",desc:"Atmospheric pollutant concentrations measured in-situ and cross-validated against Copernicus CAMS regional forecasts.",indicators:["O₃ concentration","PM2.5","PM10","CO₂","NOₓ","SO₂"],reading:"PM10 is the mass of airborne particles under 10 µm that can reach the lungs. 27 µg/m³ is a daily mean well below the 50 µg/m³ advisory line; only a sustained breach raises a public alert.",sample:{label:"PM10 · Corfu town",value:"27 µg/m³",threshold:"alert when PM10 > 50 µg/m³"}},{id:"water",name:"Water Quality",icon:nh,color:"#16626b",gstc:"D(b) Resource Management",desc:"Sea surface temperature, turbidity, chlorophyll-a and bacterial indicators from CMEMS and coastal stations.",indicators:["Sea surface temp","Turbidity","Chlorophyll-a","Coliform bacteria"],reading:"Chlorophyll-a is a proxy for phytoplankton and nutrient load. A coastal value of 0.42 mg/m³ indicates low nutrient pressure; 1.0 mg/m³ flags an increased risk of algal bloom.",sample:{label:"Chlorophyll-a · Glyfada",value:"0.42 mg/m³",threshold:"alert when chlorophyll-a > 1.0 mg/m³"}},{id:"noise",name:"Noise Pollution",icon:rg,color:"#8a6d9c",gstc:"D(c) Waste & Emissions",desc:"Decibel levels at key cultural and natural sites, with temporal patterns across the season.",indicators:["dB levels at key sites","Night-time noise","Event peaks","Temporal patterns"],reading:"A-weighted decibels approximate how loud a sound feels to humans. A night-time level of 61 dB(A) in a historic square exceeds the 55 dB(A) guideline and may disturb sleep.",sample:{label:"Old Town square, 23:00",value:"61 dB(A)",threshold:"alert when night noise > 55 dB(A)"}},{id:"crowd",name:"Crowd Density",icon:bc,color:"#c9a24b",gstc:"A(c) Managing Pressure",desc:"Pedestrian flow, dwell times and zone occupancy from privacy-preserving optical counting — the twin's core pressure signal.",indicators:["Pedestrian flow rates","Dwell times","Zone occupancy","Carrying capacity %"],reading:"Occupancy is the share of a site's carrying capacity currently in use. At 92%, the Old Port exceeds the 85% comfort threshold, triggering rerouting recommendations and crowd-management action.",sample:{label:"Old Port · Corfu",value:"92% capacity",threshold:"alert when occupancy > 85%"}},{id:"transport",name:"Transport Pressure",icon:th,color:"#5b584c",gstc:"D(f) Transport",desc:"Road congestion, public-transport uptake and parking occupancy fused from traffic APIs and maritime/aviation arrivals.",indicators:["Congestion index","Public transport usage","Parking occupancy","Ferry & flight volumes"],reading:"Port arrivals count scheduled ferry calls per day. Twelve calls remain below the 14-per-day saturation line, so quay and road handling are still within the modelled capacity.",sample:{label:"Corfu port arrivals",value:"12 ferries/day",threshold:"alert when arrivals > 14 ferries/day"}},{id:"energy",name:"Energy Consumption",icon:oh,color:"#c9a24b",gstc:"D(b) Resource Management",desc:"Tourism-sector energy demand and the renewable share of supply across islands.",indicators:["Tourism-sector energy use","Renewable share","Peak demand","Grid stress hours"],reading:"Peak demand is the seasonal maximum grid load compared with a low-season baseline. A +38% August peak exceeds the +30% stress line, indicating reduced supply margin and local grid strain.",sample:{label:"Peak demand · August",value:"+38% vs. baseline",threshold:"alert when increase > 30%"}},{id:"waste",name:"Waste Generation",icon:rh,color:"#7d8a5c",gstc:"D(c) Waste & Emissions",desc:"Solid waste per visitor, recycling rates and single-use plastic prevalence across destinations.",indicators:["Solid waste per visitor","Recycling rates","Single-use plastics","Collection overflows"],reading:"Solid waste per visitor-day estimates the tourism-related disposal load. 2.1 kg per day is below the 2.5 kg alert line, but remains above a low-impact target.",sample:{label:"Waste / visitor-day",value:"2.1 kg",threshold:"alert when waste > 2.5 kg/day"}},{id:"biodiversity",name:"Biodiversity Impact",icon:eh,color:"#4c7a4f",gstc:"D(a) Conservation",desc:"NDVI vegetation trends from Sentinel-2, habitat disturbance indices and invasive-species alerts.",indicators:["NDVI trends","Habitat disturbance","Posidonia meadow health","Invasive species alerts"],reading:"The Normalised Difference Vegetation Index estimates green vegetation density from Sentinel-2 imagery. A 4.2% year-on-year decline beyond the 3% threshold signals possible habitat degradation at the dune sites.",sample:{label:"NDVI · dune sites",value:"−4.2% YoY",threshold:"alert when decline > 3% YoY"}},{id:"heritage",name:"Cultural Heritage",icon:kr,color:"#a54c2b",gstc:"C(a) Cultural Heritage",desc:"Visitor counts at monuments, structural monitoring and heritage-condition indices for the islands' historic assets.",indicators:["Site visitor counts","Structural monitoring","Heritage condition index","Carrying capacity"],reading:"Daily visitor throughput is a proxy for physical pressure on a monument. 6,400 visits remain below the 7,000-per-day conservation limit, keeping footfall within the modelled tolerance.",sample:{label:"Old Fortress · daily",value:"6,400 visitors",threshold:"alert when visitors > 7,000/day"}},{id:"socio",name:"Socio-Economic",icon:ah,color:"#16626b",gstc:"B(a) Economic Benefits",desc:"Visitor expenditure, local employment and the distribution of tourism's economic benefit across communities.",indicators:["Visitor expenditure","Local employment","Benefit distribution","Season length"],reading:"Average expenditure per visitor-day estimates how much tourism value remains in the local economy. At €142, the destination exceeds the €120 target, indicating meaningful local retention.",sample:{label:"Avg. spend / visitor-day",value:"€142",threshold:"target: ≥ €120/visitor-day"}}],v1=[{layer:"Frontend — Web",tech:["React / Vue.js","Mapbox GL","Leaflet","D3.js","Chart.js"],desc:"Accessible, map-first dashboards"},{layer:"Frontend — Mobile",tech:["React Native / Flutter","Push notifications","Offline-first"],desc:"Citizen & visitor companion"},{layer:"Backend",tech:["Python · FastAPI","Django","Node.js microservices"],desc:"APIs and service orchestration"},{layer:"GIS & Spatial",tech:["PostGIS","GeoServer","QGIS","Google Earth Engine"],desc:"The spatial nervous system"},{layer:"Data Processing",tech:["Apache Kafka","Apache Spark","Apache Flink"],desc:"Streaming and batch pipelines"},{layer:"Databases",tech:["PostgreSQL + PostGIS","TimescaleDB","Elasticsearch"],desc:"Spatial, time-series and search"},{layer:"ML / AI",tech:["scikit-learn","TensorFlow / PyTorch","Hugging Face"],desc:"Forecasting and anomaly detection"},{layer:"LLM Interface",tech:["RAG — LangChain / LlamaIndex","NL-to-SQL","Data warehouse"],desc:"Conversational access to the twin"},{layer:"IoT Ingestion",tech:["MQTT broker","LoRaWAN network server","Azure / AWS IoT Hub"],desc:"Sensor-to-cloud connectivity"},{layer:"Satellite Data",tech:["Copernicus CDSE","Sentinel Hub","Google Earth Engine"],desc:"Orbit-scale observation"},{layer:"Cloud & Hosting",tech:["EU cloud (GDPR)","Kubernetes / OpenShift"],desc:"European, sovereign by design"},{layer:"Monitoring & Ops",tech:["Prometheus","Grafana","Email · push · SMS alerts"],desc:"Keep-the-lights-on layer"}],_1=[{id:"D1",name:"Data Collection and Integration",desc:"Integration of open web data, existing systems and ten indoor collection stations for selected environmental observations.",phase:"2027 · H1"},{id:"D2",name:"Data Ingestion Platform",desc:"Unified pipeline for all heterogeneous streams — satellite, maritime, aviation, weather, traffic and crowdsourced.",phase:"2027 · H2"},{id:"D3",name:"Digital Twin Web Dashboard",desc:"Multi-layer GIS platform with real-time overlays, heatmaps and trend visualisation.",phase:"2028 · H1"},{id:"D4",name:"Dynamic Crowding & Pollution Map",desc:"Interactive map of pollutant concentrations, historical data and AI-predicted trends.",phase:"2028 · H1"},{id:"D5",name:"Composite Pressure & Sustainability Index",desc:"AI-derived composite metric aligned with GSTC v2.0, computed across 34 indicators.",phase:"2028 · H2"},{id:"D6",name:"ML/AI Predictive Engine",desc:"Correlation models linking tourism to environmental conditions; anomaly detection; forecasting.",phase:"2028 · H2"},{id:"D7",name:"LLM Query Interface",desc:"Natural-language interface for stakeholders to query the twin conversationally.",phase:"2028 · H2"},{id:"D8",name:"Mobile Application",desc:"Citizen and visitor app with alerts, crowdsourcing and alternative recommendations — WCAG 2.0 compliant.",phase:"2029 · H1"},{id:"D9",name:"Sustainability Assessment Report",desc:"     <div id="root"></div>
    <script>
      /* Apply the saved palette + language before first paint to avoid a flash. */
      (function () {
        try {
          var p = localStorage.getItem("ioniandtwin.palette");
          var map = {
            ocean: { c: "#F5F8FA", i: "#0A1930", d: "#050C17" },
            emerald: { c: "#f9faf8", i: "#132a13", d: "#081c15" },
            clay: { c: "#f4f1e8", i: "#1e1d19", d: "#131210" },
          };
          var v = map[p] || map.clay;
          var s = document.documentElement.style;
          s.setProperty("--color-cream", v.c);
          s.setProperty("--color-ink", v.i);
          s.setProperty("--color-ink2", v.d);
        } catch (e) {}
      })();
    </script>
