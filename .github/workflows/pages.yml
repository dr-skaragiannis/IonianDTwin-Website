# Builds the static site and publishes it to GitHub Pages.
#
# ONE-TIME SETUP (repository admin): Settings → Pages → "Build and deployment"
# → Source: "GitHub Actions". Creating the Pages site needs admin rights that
# neither this workflow's GITHUB_TOKEN nor an app token has, so until that
# switch is flipped the build job succeeds but the deploy job fails. The build is stamped with the Pages
# mount point (SITE_BASE), so the same code serves both
#   https://<owner>.github.io/<repo>/      (project pages, sub-path)
#   https://ioniandtwin.di.ionio.gr/       (custom domain / Apache, root)
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - arena/01a0c8d5-ioniandtwin-website
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deploy that is already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Reports the Pages mount point ("/<repo>" for project pages, "" with a
      # custom domain). Allowed to fail so the build is still verified before
      # Pages has been switched on; the deploy job then fails on its own.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true
        with:
          enablement: true

      # public/ (shells, fonts, tiles, icons) is copied into dist/ by Vite and
      # the SPA is bundled into dist/index.html. base_path is "/<repo>" for
      # project pages and "" when a custom domain is configured.
      - name: Build static site
        run: npm run build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
