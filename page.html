works",hTitle:"From question to grounded answer.",hLede:"No GIS degree required. Try the preview — then see the pipeline that makes every answer trustworthy.",steps:[{n:"01",t:"Natural language in",d:"A stakeholder asks in plain Greek or English — typed or spoken."},{n:"02",t:"Intent → SQL",d:"A RAG pipeline maps the question onto the platform's spatial schema."},{n:"03",t:"Data lake query",d:"The query runs against the twin's harmonised spatio-temporal store."},{n:"04",t:"Grounded answer out",d:"The LLM answers with real numbers, sources and confidence."}],tEyebrow:"Trust by design",tTitle:"Grounded, not improvised.",tLede:"An LLM is only useful in governance if it cannot invent. Three mechanisms keep the twin's answers honest.",trust:[{t:"RAG grounding",d:"LangChain / LlamaIndex ground the model in the platform's spatial schema and documentation — it answers from the twin, not from memory."},{t:"Validated NL-to-SQL",d:"Natural language compiles into schema-checked spatial queries. Numbers are computed by the database, never hallucinated by the model."},{t:"Source attribution",d:"Every figure traces back to its feed — sensors, CAMS, MarineTraffic — with timestamps and confidence attached."}],note:"At deployment the interface connects to the live data lake over the platform's API — the preview shows exactly how a trained answer will look."},indicators:{eyebrow:"Sustainability indicators",crumb:"Indicators",titleA:"34 indicators. 10 categories.",titleB:"One index.",lede:"The twin's measurement spine: every indicator carries real-time measurement, historical trend analysis and threshold-based alerting — aligned with the GSTC Destination Criteria v2.0.",meta:["GSTC v2.0 aligned","Threshold-based alerting","Historical trend analysis","Real-time measurement"],ciEyebrow:"The composite index",ciTitle:"A single number you can govern with.",ciLede:"Environmental, social and tourism-flow metrics fold into one AI-derived score — the region's vital sign, recomputed continuously.",ciNote:"Illustrative value · Corfu, peak season",ciGauge:"/ 100 · HIGH",ciLow:"0–40 low",ciWatch:"40–70 watch",ciAlert:"70–100 alert",steps:[{t:"Measure",d:"Every indicator carries a real-time measurement channel — sensor, satellite or statistical — with full historical depth."},{t:"Model",d:"ML models normalise, weight and correlate each indicator against tourism-flow and seasonality context."},{t:"Index",d:"The result folds into one composite Sustainability Index — comparable across sites, seasons and years."}],exEyebrow:"The ten categories",exTitle:"Every pressure, instrumented.",exLede:"Select a category to inspect its indicators, GSTC mapping and example threshold alert.",catCount:"Indicators",catStandard:"GSTC criterion",catThreshold:"Alert threshold",catMeasures:"What it measures",catRead:"How to read this",catProcess:"How the Digital Twin improves sustainability",catProcessText:"The Digital Twin turns this measurement into a management cycle: establish a baseline, compare the live value with the policy threshold, notify the responsible team when it is crossed, record the intervention, and verify whether the next measurement improves.",catDemo:"Demo",gEyebrow:"Standards alignment",gTitleA:"Aligned with",gTitleB:"GSTC v2.0.",gLede:"The Global Sustainable Tourism Council's Destination Criteria v2.0 define the international benchmark for sustainable destination management. The twin maps all 34 indicators onto its four pillars — making certification evidence a by-product of operation.",gBtn:"Read the GSTC criteria",alEyebrow:"From threshold to action",alTitle:"Alerts that reach someone.",alertSteps:[{n:"01",t:"Threshold breached",d:"An indicator crosses its policy threshold — e.g. an air-quality limit exceeded at a monitored site."},{n:"02",t:"Alert routed",d:"Email, push and SMS notifications reach the responsible municipal desk in seconds."},{n:"03",t:"Action logged",d:"Interventions are recorded against the alert — building the region's response evidence base."},{n:"04",t:"Policy refined",d:"Season-over-season alert analytics inform carrying-capacity and licensing policy."}],alertNote:"Every alert also surfaces in the mobile app — citizens become part of the response loop."},dataSources:{eyebrow:"Resources · Data ingestion",crumb:"Data Sources",titleA:"Twelve feeds.",titleB:"One data lake.",lede:"The twin's primary foundation is open web data and existing systems: orbit, sea, sky, road, tourism and citizen sources are harmonised into a single spatio-temporal data model with two levels of spatial resolution.",meta:["Satellite · EO","Maritime & aviation","Weather & traffic","Citizen reports"],scaleEyebrow:"Single model, two scales",scaleNote:"Every feed — orbit, sea, sky, road and citizen sources — folds into one spatio-temporal model at two resolutions: regional (macro) and per-island municipal (micro). The platform reads both scales from the same store.",scaleLink:"Explore the two scales",tbEyebrow:"Primary data feeds",tbTitle:"Where the data comes from.",tbLede:"Open, documented and API-accessible wherever possible — starting with Europe's own Copernicus services.",thSource:"Source",thType:"Type",thData:"Data provided",thAccess:"Access",note:"Ten indoor collection stations provide complementary local measurements. Where crowd observation is used, collection is privacy-preserving by design and no personal data is stored.",noteLink:"Architecture"},related:{eyebrow:"Resources · Ecosystem",crumb:"Related Projects",titleA:"Part of the",titleB:"European digital-twin ecosystem.",lede:"Local Digital Twins for tourism, heritage and sustainability form an active European field of research and innovation. IonianDTwin builds on this body of work and contributes to its continued development.",meta:["Interreg Euro-MED","Horizon Europe","ESA · DestinE","Corfu pilot project"],ey:"Ten related projects",title:"The European digital-twin ecosystem.",link:"Cited standards, papers & data providers"},references:{eyebrow:"Resources · Cited sources",crumb:"References",titleA:"Standards, papers &",titleB:"providers.",lede:"The twin is designed around public standards, open Copernicus data and peer-reviewed research. Everything the proposal builds on is listed here.",meta:["GSTC v2.0","WCAG 2.0","Peer-reviewed literature","Copernicus services"],gEyebrow:"Four groups",gTitle:"The full canon.",link:"Browse related projects",ack:"“The European Regional Development Fund and the Ionian Islands Programme 2021–2027 make this work possible.”",ackSrc:"IonianDTwin · OPS 6061866 · proposal phase"},contact:{eyebrow:"Contact",crumb:"Contact",titleA:"Talk to",titleB:"the consortium.",lede:"Questions about the proposal, partnership opportunities, piloting on your island, or press — the IonianDTwin team at Ionian University wants to hear from you.",meta:["Proposal phase","Response within 3 working days","Corfu · Greece"],formTag:"Send a message · form D-01",name:"Full name *",namePh:"Maria Konstantinou",email:"Email *",emailPh:"you@example.gr",org:"Organisation",orgPh:"Municipality of Corfu",topic:"Topic *",topicPh:"Select a topic…",topics:["Partnership / pilot participation","Municipality or region enquiry","Research collaboration","Citizen & visitor programme","Press & media","Other"],message:"Message *",messagePh:"Tell us about your island, your question, or how you'd like to be involved…",consent:"By sending, you consent to the consortium processing your data solely to respond to this enquiry (GDPR).",send:"Send message",sentTitle:"Message received.",sentBody:"Efcharistó! The consortium aims to reply within three working days. For urgent matters, write directly to",sentAgain:"Send another message",leadTag:"Consortium lead",leadName:"Ionian University",leadSub:"ELKE-IP — Special Account for Research Funds",leadAddr:"Corfu 491 00, Ionian Islands, Greece",leadReply:"Replies within 3 working days",authTag:"Managing authority",authName:"Ionian Islands Programme",authSub:"Operational Programme “Ionian Islands” 2021–2027",whoTag:"Who writes to us",audiences:[{t:"Municipalities & region",d:"Pilots, sensor hosting, dashboard access and indicator calibration for your island."},{t:"Researchers & academia",d:"Data partnerships, co-authored studies and thesis opportunities with Ionian University."},{t:"Citizens & visitors",d:"Early access to the mobile app pilot and community briefings on Corfu and beyond."}],dpoTag:"Data Protection",dpoTitle:"Your data & the DPO",dpoBody:"Data you share with the consortium is processed solely to respond to your enquiry, in accordance with the GDPR (Regulation (EU) 2016/679). For any matter concerning the processing of your personal data, or to exercise your rights under the GDPR, contact the Data Protection Officer (DPO) of Ionian University.",dpoLink:"Ionian University · Data Protection & Privacy",dpoUrl:"https://gdpr.ionio.gr/",faqEyebrow:"FAQ",faqTitle:"Asked often, answered here.",faqs:[{q:"When does IonianDTwin start?",a:"The project is currently in the proposal phase under the Ionian Islands Programme 2021–2027. The target start date is 1 September 2026, running for 30 months until 31 March 2029."},{q:"Can my municipality or island take part?",a:"Yes — the twin is designed for the whole region. Municipalities interested in hosting sensor stations, piloting the dashboard or shaping the indicator thresholds are encouraged to write to us; the consortium is finalising its partner list during the proposal phase."},{q:"Will the data be open?",a:"The platform is built on open standards (OGC services, open APIs) and public data sources like Copernicus. Aggregated, anonymised indicator data will be published openly; raw sensor and citizen-report data remain subject to GDPR safeguards."},{q:"How can citizens and visitors contribute?",a:"Through the mobile app's crowdsourcing layer — report pollution, habitat damage or accessibility barriers with a photo. Verified reports become part of the twin's live data and improve the models for everyone."}]},privacy:{eyebrow:"Legal · Privacy",crumb:"Privacy Policy",titleA:"Your privacy,",titleB:"taken seriously.",lede:"This Privacy Policy explains how the IonianDTwin consortium at Ionian University processes personal data in connection with this website and its contact forms, in accordance with the General Data Protection Regulation (Regulation (EU) 2016/679 — GDPR).",meta:["GDPR 679/2016","Ionian University","Data Protection Officer","Contact forms"],lastUpdated:"Last updated: August 2026",sections:[{title:"1. Data controller",body:"The data controller for the processing described in this policy is Ionian University (special account ELKE-IP), 7 Tsirigoti Square, Corfu 491 00, Greece — the lead partner of the IonianDTwin consortium."},{title:"2. Data we process",body:"When you use the website or contact forms, we may process the personal data you voluntarily provide, such as your name, email address, organisation and the content of your message. We process only the data necessary to respond to your enquiry. The website itself serves static content and does not require an account."},{title:"3. Purpose and legal basis",body:"Your data are processed solely to respond to your enquiry, to manage partnership and piloting requests, and to support research and innovation activities under the Ionian Islands Programme 2021–2027. The legal bases are your consent (Article 6(1)(a) of the GDPR) where you provide it, and the performance of tasks carried out in the public interest (Article 6(1)(e) of the GDPR)."},{title:"4. Retention",body:"Data are retained only for as long as necessary to fulfil the purpose for which they were collected, and thereafter in accordance with Ionian University's records-management policy and applicable legal obligations."},{title:"5. Your rights",body:"Under the GDPR you have the right to access, rectify, erase and restrict the processing of your personal data, the right to data portability, the right to object, and — where processing is based on consent — the right to withdraw consent at any time. You also have the right to lodge a complaint with the Hellenic Data Protection Authority (dpa.gr)."},{title:"6. Data Protection Officer",body:"For any matter concerning the processing of your personal data, or to exercise your rights under the GDPR, you may contact the Data Protection Officer (DPO) of Ionian University through the official personal-data portal."}],cookiesTitle:"7. Cookies and scripts",cookiesIntro:"This website is deliberately lightweight. We do not use advertising, analytics or other tracking cookies, and we do not set any cross-site tracking scripts. The only data stored or transferred on your device are listed below, with full transparency.",thName:"Name",thType:"Type",thPurpose:"Purpose",thData:"Data",cookies:[{name:"ioniandtwin.lang",type:"localStorage",purpose:"Remembers your chosen language (Greek or English) so the site renders in your preferred language on every visit.",data:"Language preference only"},{name:"ioniandtwin.palette",type:"localStorage",purpose:"Remembers your selected colour theme so the appearance is consistent across visits.",data:"Theme name only"}],cookieNote:"localStorage entries are stored locally in your browser and are never transmitted to our servers. They contain only a language or theme preference and no personal or identifying data. You can clear them at any time through your browser's settings.",scriptHeading:"Scripts and external resources",scripts:[{name:"Web fonts (self-hosted)",layer:"First-party",purpose:"The typography used on the site (Commissioner, IBM Plex Sans, JetBrains Mono) is served from this website's own server. No font request is made to Google or any other third party.",provider:"IonianDTwin — ioniandtwin.di.ionio.gr"},{name:"Map tiles (CARTO / OpenStreetMap)",layer:"Third-party",purpose:"Loads the interactive basemap tiles for the Digital Twin map. Your device requests tile images from the CARTO CDN, which may see your IP address and the tiles you view.",provider:"basemaps.cartocdn.com / openstreetmap.org"},{name:"Contact form",layer:"First-party",purpose:"Collects the data you submit (name, email, organisation, message) solely to respond to your enquiry. No data is stored in cookies or sent to third parties.",provider:"IonianDTwin consortium"}],scriptNote:"No advertising, analytics, remarketing or social-media scripts are loaded by this website. The contact form is processed manually by the consortium and is not linked to any analytics platform.",dpoLink:"Contact the Data Protection Officer of Ionian University",dpoUrl:"https://gdpr.ionio.gr/"},notFound:{tag:"404 · Off the chart",titleA:"The page",titleB:"was not found.",lede:"The page you are looking for does not exist or is no longer available. Return to the home page to continue browsing.",back:"Back to home",contact:"Contact us"},dash:{sustainability:"Sustainability index",watch:"Watch",indicators:"34 indicators",categories:"10 categories",updated:"Updated 12 s ago",aqi:"Air quality index",crowd:"Crowd index · Corfu",seaTemp:"Ionian sea temp",alerts:"Active alerts",forecast:"Sustainability outlook · 14-day AI forecast",observed:"observed",forecasted:"forecast",confidence:"confidence",sources:"Sources · sensors · CAMS · MarineTraffic · Flightradar24",intensity:"Indicator intensity",low:"LOW",watchLow:"WATCH",alert:"ALERT",disclaimer:"Simulated preview · illustrative data — basemap © OpenStreetMap · CARTO",layers:{environment:"Environmental",transport:"Transport",infrastructure:"Infrastructure"},islandLabels:["CORFU","PAXI","LEFKADA","KEFALONIA","ITHACA","ZAKYNTHOS"],today:"TODAY"},llm:{title:"Twin Intelligence",sub:"RAG → NL-to-SQL → data lake",preview:"D7 · preview",greeting:"Kalimera. I'm the twin's natural-language interface — ask me anything about the environment, ecosystems or outlook of the Ionian Islands.",thinking:"Consulting the data lake…",placeholder:"Ask about air quality, ecosystems, forecasts…",send:"Send",fallback:"At deployment, this interface will run a live RAG pipeline over the platform's data lake — translating natural language to SQL. In this preview, try one of the suggested questions to see how a trained answer looks.",qa:[{q:"Which sites exceeded environmental thresholds this week?",a:"Three monitored zones exceeded their thresholds in the last 7 days. Glyfada (Corfu) peaked at 118% of its carrying capacity on 9 August; Paleokastritsa remained above threshold for 3 consecutive days; Navagio (Zakynthos) crossed 96% once. I recommend targeted interventions through the mobile app's alternative-activity feed.",stats:[{k:"Glyfada peak",v:"118%"},{k:"Zone-days over threshold",v:"9"},{k:"Active hotspots",v:"3"}],sources:["Crowd sensors","Sentinel-1 SAR","Citizen reports"]},{q:"How is air quality trending in Corfu town?",a:"Improving versus July. PM10 is down 12% month-over-month (31 → 27 µg/m³), NO₂ holds at 19 µg/m³, and ozone sits within EU targets. The composite AQI reads 41 — moderate. The ML model attributes ≈38% of variance to traffic (R² = 0.38).",stats:[{k:"PM10 change",v:"−12%"},{k:"Composite AQI",v:"41/100"},{k:"Traffic R²",v:"0.38"}],sources:["IoT air sensors","Copernicus CAMS","OpenWeather"]},{q:"What is the environmental outlook for Kefalonia next weekend?",a:"Elevated pressure — composite index 0.71, warning band. Arrivals are forecast at +14% week-over-week on 12 scheduled ferries and ≈38 daily flights. Recommended actions: pre-position waste collection in Argostoli and reinforce monitoring at Myrtos beach.",stats:[{k:"Pressure index",v:"0.71"},{k:"Arrivals Δ WoW",v:"+14%"},{k:"Ferries · flights/day",v:"12 · 38"}],sources:["MarineTraffic","Flightradar24","ML forecast"]},{q:"Compare sustainability across the Ionian islands.",a:"Composite sustainability scores: Ithaca 0.81, Paxi 0.74, Kefalonia 0.66, Lefkada 0.63, Zakynthos 0.55, Corfu 0.48. Corfu's score is weighted by crowd and waste indicators; Zakynthos by coastal turbidity at Navagio.",stats:[{k:"Best · Ithaca",v:"0.81"},{k:"Lowest · Corfu",v:"0. ς πόρους, την ενέργεια, τα απόβλητα και την πολιτιστική κληρονομιά, τα μετασχηματίζει σε μετρήσιμους δείκτες βιωσιμότητας.",ctaPrimary:"Εξερεύνηση του ψηφιακού διδύμου",ctaSecondary:"Βιωσιμότητα",metaLead:"Φορέας Υλοποίησης · Ιόνιο Πανεπιστήμιο (ΕΛΚΕ)",metaOps:"ΚΩΔ. OPS 6061866",metaYears:"2026 → 2029",heroRegion:"NUTS-2 · Ιόνια Νησιά",heroEo:"Σύνθεση δορυφορικών δεδομένων · Sentinel-2",heroIndex:"Δείκτης βιωσιμότητας · περιφέρεια",heroIndexGood:"καλή",heroStatus:"Συγχρονισμός διδύμου · 12 δευτ. πριν",legendLow:"χαμηλό",legendWatch:"προσοχή",legendAlert:"συναγερμός",heroCaption:"Όψη Ψηφιακού Διδύμου — αισθητήρια μέτρηση, παρακολούθηση οικοτόπων & σύνθεση EO · Κέρκυρα · Παξοί · Λευκάδα · Κεφαλονιά · Ιθάκη · Ζάκυνθος",islands:["Κέρκυρα","Παξοί","Λευκάδα","Κεφαλονιά","Ιθάκη","Ζάκυνθος"],ovEyebrow:"Γιατί βιωσιμότητα",ovTitleA:"Ένα οικοσύστημα που",ovTitleB:"δεν αντικαθίσταται.",ovBody:"Τα Ιόνια Νησιά διαθέτουν σπάνιο φυσικό πλούτο: εκτεταμένα λιβάδια Ποσειδωνίας, ευαίσθητες αμμοθίνες, μεσογειακή μακία και πρότυπες θαλάσσιες προστατευόμενες περιοχές. Αυτά τα οικοσυστήματα συνιστούν τη ραχοκοκαλιά της τοπικής οικονομίας και πολιτιστικής ταυτότητας. Η διατήρησή τους δεν λειτουργεί ως περιορισμός, αλλά ως το μοναδικό βιώσιμο μέλλον της περιφέρειας.",stats:[{to:34,suffix:"",label:"δείκτες βιωσιμότητας, με συνεχή παρακολούθηση"},{to:10,suffix:"",label:"κατηγορίες GSTC v2.0, ένας ελέγξιμος δείκτης"},{to:6,suffix:"",label:"νησιά — ένα ζωντανό περιφερειακό δίδυμο"},{to:12,suffix:"",label:"πηγές δεδομένων, με ζωντανή ενοποίηση"}],platLinks:["Άνοιγμα Πίνακα Ελέγχου","Άνοιγμα εφαρμογής κινητού","Άνοιγμα διεπαφής LLM"],preEyebrow:"Δύο διεπαφές",preTitleA:"Ένα δίδυμο,",preTitleB:"δύο διεπαφές.",preLede:"Ο πίνακας ελέγχου (dashboard) απευθύνεται στους αρμόδιους φορείς, ενώ η εφαρμογή για κινητά εξυπηρετεί πολίτες και επισκέπτες. Και οι δύο πλατφόρμες τροφοδοτούνται από την ίδια βάση δεδομένων και αναλύονται διεξοδικά στις αντίστοιχες ενότητες.",exploreEyebrow:"Εξερεύνηση του διδύμου", ζουν το διεθνές σημείο αναφοράς για τη βιώσιμη διαχείριση προορισμών. Το δίδυμο αντιστοιχίζει και τους 34 δείκτες στους τέσσερις πυλώνες του — καθιστώντας τα τεκμήρια πιστοποίησης παράγωγο της λειτουργίας.",gBtn:"Ανάγνωση των κριτηρίων GSTC",alEyebrow:"Από το κατώφλι στη δράση",alTitle:"Ειδοποιήσεις που φτάνουν στους αρμόδιους.",alertSteps:[{n:"01",t:"Υπέρβαση κατωφλίου",d:"Ένας δείκτης υπερβαίνει το κατώφλι πολιτικής — π.χ. όριο ποιότητας αέρα σε παρακολουθούμενη τοποθεσία."},{n:"02",t:"Δρομολόγηση ειδοποίησης",d:"Ειδοποιήσεις μέσω email, push και SMS φτάνουν σε δευτερόλεπτα στο αρμόδιο δημοτικό γραφείο."},{n:"03",t:"Καταγραφή ενέργειας",d:"Οι παρεμβάσεις καταγράφονται σε σχέση με την ειδοποίηση — οικοδομώντας τη βάση τεκμηρίων απόκρισης της περιφέρειας."},{n:"04",t:"Βελτίωση πολιτικής",d:"Η ανάλυση δεδομένων των ειδοποιήσεων ανά σεζόν ενημερώνει την πολιτική χωρητικότητας και αδειοδότησης."}],alertNote:"Κάθε ειδοποίηση εμφανίζεται επίσης στην εφαρμογή κινητού — οι πολίτες γίνονται μέρος του κύκλου απόκρισης."},dataSources:{eyebrow:"Πόροι · Εισαγωγή δεδομένων",crumb:"Πηγές Δεδομένων",titleA:"Δώδεκα πηγές.",titleB:"Μία λίμνη δεδομένων.",lede:"Το βασικό θεμέλιο του διδύμου είναι τα ανοικτά διαδικτυακά δεδομένα και τα υφιστάμενα συστήματα: πηγές από την τροχιά, τη θάλασσα, τον αέρα, το οδικό δίκτυο, τον τουρισμό και τους πολίτες εναρμονίζονται σε ένα ενιαίο χωροχρονικό μοντέλο δεδομένων με δύο επίπεδα χωρικής ανάλυσης.",meta:["Δορυφόρος · EO","Ναυτιλία & αεροπορία","Καιρός & κυκλοφορία","Αναφορές πολιτών"],scaleEyebrow:"Ένα μοντέλο, δύο κλίμακες",scaleNote:"Κάθε πηγή — τροχιά, θάλασσα, αέρας, οδικό δίκτυο και πολίτες — εναρμονίζεται σε ένα ενιαίο χωροχρονικό μοντέλο σε δύο αναλύσεις: περιφερειακή (μακρο) και δημοτική ανά νησί (μικρο). Το δίδυμο αντλεί και τις δύο κλίμακες από την ίδια αποθήκη.",scaleLink:"Εξερευνήστε τις δύο κλίμακες",tbEyebrow:"Κύριες πηγές δεδομένων",tbTitle:"Από πού προέρχονται τα δεδομένα.",tbLede:"Ανοιχτές, τεκμηριωμένες και προσβάσιμες μέσω API mTag:"Αποστολή μηνύματος · φόρμα D-01",name:"Ονοματεπώνυμο *",namePh:"Μαρία Κωνσταντίνου",email:"Ηλεκτρονική διεύθυνση *",emailPh:"you@example.gr",org:"Οργανισμός",orgPh:"Δήμος Κέρκυρας",topic:"Θέμα *",topicPh:"Επιλέξτε θέμα…",topics:["Συνεργασία / συμμετοχή σε πιλοτική εφαρμογή","Ερώτημα δήμου ή περιφέρειας","Ερευνητική συνεργασία","Πρόγραμμα πολιτών & επισκεπτών","Τύπος και μέσα ενημέρωσης","Άλλο"],message:"Μήνυμα *",messagePh:"Πείτε μας για το νησί σας, την ερώτησή σας ή πώς θα θέλατε να συμμετάσχετε…",consent:"Με την αποστολή συναινείτε στην επεξεργασία των δεδομένων σας αποκλειστικά για την απάντηση σε αυτό το αίτημα (GDPR).",send:"Αποστολή μηνύματος",sentTitle:"Το μήνυμα ελήφθη.",sentBody:"Ευχαριστούμε! Η κοινοπραξία στοχεύει σε απάντηση εντός τριών εργάσιμων ημερών. Για επείγοντα, απευθυνθείτε απευθείας στο",sentAgain:"Αποστολή άλλου μηνύματος",leadTag:"Φορέας Υλοποίησης",leadName:"Ιόνιο Πανεπιστήμιο",leadSub:"ΕΛΚΕ — Ειδικός Λογαριασμός Κονδυλίων Έρευνας",leadAddr:"Κέρκυρα 491 00, Ιόνια Νησιά, Ελλάδα",leadReply:"Απάντηση εντός 3 εργάσιμων ημερών",authTag:"Αρμόδια αρχή",authName:"Πρόγραμμα Ιονίων Νήσων",authSub:"Επιχειρησιακό Πρόγραμμα «Ιόνια Νησιά» 2021–2027",whoTag:"Σε ποιους απευθυνόμαστε",audiences:[{t:"Δήμοι & περιφέρεια",d:"Πιλοτικές εφαρμογές, φιλοξενία αισθητήρων, πρόσβαση στον πίνακα ελέγχου και βαθμονόμηση δεικτών για το νησί σας."},{t:"Ερευνητές & ακαδημαϊκή κοινότητα",d:"Συνεργασίες δεδομένων, από κοινού δημοσιεύσεις και ευκαιρίες εκπόνησης διπλωματικών με το Ιόνιο Πανεπιστήμιο."},{t:"Πολίτες & επισκέπτες",d:"Πρόωρη πρόσβαση στο πιλοτικό πρόγραμμα της εφαρμογής και ενημερωτικές συναντήσεις στην Κέρκυρα και όχι μόνο."}],dpoTag:"Προστασία Δεδομένων",dpoTitle:"Τα δεδομένα σας & ο ΥΠΔ",dpoBody:"Τα δεδομένα που μοιράζεστε με την κοινοπραξία επεξεργάζονται αποκλειστικά για την απάντηση στο αίτημά σας, σύμφωνα με τον ΓΚΠΔ (Κανονισμός (ΕΕ) 2016/679). Για κάθε θέμα που αφορά την επεξεργασία των προσωπικών σας δεδομένων ή για την άσκηση των δικαιωμάτων σας δυνάμει του ΓΚΠΔ, επικοινωνήστε με τον Υπεύθυνο Προστασίας Δεδομένων (ΥΠΔ) του Ιονίου Πανεπιστημίου.",dpoLink:"Ιόνιο Πανεπιστήμιο · Προστασία Δεδομένων & Ιδιωτικότητα",dpoUrl:"https://gdpr.ionio.gr/",faqEyebrow:"Συχνές ερωτήσεις",faqTitle:"Συχνές ερωτήσεις, με απαντήσεις εδώ.",faqs:[{q:"Πότε ξεκινά το IonianDTwin;",a:"Το έργο βρίσκεται επί του παρόντος σε φάση πρότασης στο Πρόγραμμα «Ιόνια Νησιά» 2021–2027. Η στοχευμένη ημερομηνία έναρξης είναι η 1η Σεπτεμβρίου 2026, με διάρκεια 30 μήνες έως τις 31 Μαρτίου 2029."},{q:"Μπορεί ο δήμος ή το νησί μου να συμμετάσχει;",a:"Ναι — το δίδυμο σχεδιάστηκε για ολόκληρη την περιφέρεια. Δήμοι που ενδιαφέρονται να φιλοξενήσουν σταθμούς αισθητήρων, να εφαρμόσουν πιλοτικά τον πίνακα ελέγχου ή να διαμορφώσουν τα κατώφλια των δεικτών προσκαλούνται να επικοινωνήσουν. Η κοινοπραξία ολοκληρώνει τον κατάλογο εταίρων στη φάση της πρότασης."},{q:"Τα δεδομένα θα είναι ανοιχτά;",a:"Η πλατφόρμα βασίζεται σε ανοιχτά πρότυπα (υπηρεσίες OGC, ανοιχτά API) και δημόσιες πηγές όπως το Copernicus. Τα συγκεντρωτικά, ανωνυμοποιημένα δεδομένα δεικτών θα δημοσιευτούν ανοιχτά. Τα ακατέργαστα δεδομένα αισθητήρων και αναφορών πολιτών παραμένουν υπό τους μηχανισμούς προστασίας του GDPR."},{q:"Πώς μπορούν να συνεισφέρουν οι πολίτες και οι επισκέπτες;",a:"Μέσω του επιπέδου συμμετοχικής καταγραφής της εφαρμογής κινητού — αναφέρετε ρύπανση, καταστροφή οικοτόπου ή εμπόδιο προσβασιμότητας με μια φωτογραφία. Οι επαληθευμένες αναφορές γίνονται μέρος των ζωντανών δεδομένων του διδύμου και βελτιώνουν τα μοντέλα για όλους."}]},privacy:{eyebrow:"Νομικά · Απόρρητο",crumb:"Πολιτική Απορρήτου",titleA:"Η ιδιωτικότητά σας",titleB:"λαμβάνεται στα σοβαρά.",lede:"Η παρούσα Πολιτική Απορρήτου εξηγεί τον τρόπο με τον οποίο η κοινοπραξία IonianDTwin στο Ιόνιο Πανεπιστήμιο επεξεργάζεται προσωπικά δεδομένα σε σχέση με τον παρόντα ιστότοπο και τις φόρμες επικοινωνίας, σύμφωνα με τον Γενικό Κανονισμό Προστασίας Δεδομένων (Κανονισμός (ΕΕ) 2016/679 — ΓΚΠΔ).",meta:["ΓΚΠΔ 679/2016","Ιόνιο Πανεπιστήμιο","Υπεύθυνος Προστασίας Δεδομένων","Φόρμες επικοινωνίας"],lastUpdated:"Τελευταία ενημέρωση: Αύγουστος 2026",sections:[{title:"1. Υπεύθυνος επεξεργασίας",body:"Υπεύθυνος επεξεργασίας για τις επεξεργασίες που περιγράφονται στην παρούσα πολιτική είναι το Ιόνιο Πανεπιστήμιο (ειδικός λογαριασμός ΕΛΚΕ), Πλατεία Τσιριγώτη 7, Κέρκυρα 491 00, Ελλάδα — επικεφαλής εταίρος της κοινοπραξίας IonianDTwin."},{title:"2. Δεδομένα που επεξεργαζόμαστε",body:"Κατά τη χρήση του ιστοτόπου ή των φορμών επικοινωνίας, ενδέχεται να επεξεργαζόμαστε τα προσωπικά δεδομένα που παρέχετε οικειοθελώς, όπως το ονοματεπώνυμο, τη διεύθυνση ηλεκτρονικού ταχυδρομείου, τον οργανισμό και το περιεχόμενο του μηνύματός σας. Επεξεργαζόμαστε μόνο τα απαραίτητα δεδομένα για την απάντηση στο αίτημά σας. Ο ιστότοπος προβάλλει στατικό περιεχόμενο και δεν απαιτεί λογαριασμό."},{title:"3. Σκοπός και νομική βάση",body:"Τα δεδομένα σας επεξεργάζονται αποκλειστικά για την απάντηση στο αίτημά σας, τη διαχείριση αιτημάτων συνεργασίας και πιλοτικής εφαρμογής, καθώς και για την υποστήριξη ερευνητικών και καινοτόμων δραστηριοτήτων στο Πρόγραμμα «Ιόνια Νησιά» 2021–2027. Νομικές βάσεις αποτελούν η συγκατάθεσή σας (άρθρο 6 παρ. 1(α) ΓΚΠΔ) όπου αυτή παρέχεται, και η εκτέλεση καθηκόντων προς το δημόσιο συμφέρον (άρθρο 6 παρ. 1(ε) ΓΚΠΔ)."},{title:"4. Περίοδος διατήρησης",body:"Τα δεδομένα διατηρούνται μόνο για το διάστημα που απαιτείται για την επίτευξη του σκοπού για τον οποίο συλλέχθηκαν και στη συνέχεια σύμφωνα με την πολιτική τήρησης αρχείων του Ιονίου Πανεπιστημίου και τις ισχύουσες έννομες υποχρεώσεις."},{title:"5. Τα δικαιώματά σας",body:"Δυνάμει του ΓΚΠΔ έχετε δικαίωμα πρόσβασης, διόρθωσης, διαγραφής και περιορισμού της επεξεργασίας των προσωπικών σας δεδομένων, δικαίωμα φορητότητας, δικαίωμα εναντίωσης και — όταν η επεξεργασία βασίζεται στη συγκατάθεση — δικαίωμα ανάκλησης της συγκατάθεσης ανά πάσα στιγμή. Έχετε επίσης δικαίωμα υποβολής καταγγελίας στην Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα (dpa.gr)."},{title:"6. Υπεύθυνος Προστασίας Δεδομένων",body:"Για κάθε θέμα που αφορά την επεξεργασία των προσωπικών σας δεδομένων ή για την άσκηση των δικαιωμάτων σας δυνάμει του ΓΚΠΔ, μπορείτε να επικοινωνήσετε με τον Υπεύθυνο Προστασίας Δεδομένων (ΥΠΔ) του Ιονίου Πανεπιστημίου, μέσω της επίσημης διαδικτυακής πύλης προστασίας προσωπικών δεδομένων."}],cookiesTitle:"7. Cookies και scripts",cookiesIntro:"Αυτός ο ιστότοπος είναι εσκεμμένα ελαφρύς. Δεν χρησιμοποιούμε cookies διαφήμισης, αναλυτικής ή άλλου τύπου ιχνηλάτησης, και δεν περιλαμβάνονται cross-site scripts παρακολούθησης. Τα μόνα δεδομένα που αποθηκεύονται ή μεταφέρονται στη συσκευή σας παρατίθενται παρακάτω, με πλήρη διαφάνεια.",thName:"Όνομα",thType:"Τύπος",thPurpose:"Σκοπός",thData:"Δεδομένα",cookies:[{name:"ioniandtwin.lang",type:"localStorage",purpose:"Θυμάται την επιλεγμένη γλώσσα (ελληνικά ή αγγλικά) ώστε ο ιστότοπος να εμφανίζεται στην προτιμώμενη γλώσσα σας σε κάθε επίσκεψη.",data:"Μόνο προτίμηση γλώσσας"},{name:"ioniandtwin.palette",type:"localStorage",purpose:"Θυμάται το επιλεγμένο χρωματικό θέμα ώστε η εμφάνιση να παραμένει σταθερή μεταξύ των επισκέψεων.",data:"Μόνο όνομα θέματος"}],cookieNote:"Οι καταχωρήσεις localStorage αποθηκεύονται τοπικά στον browser σας και δεν μεταδίδονται ποτέ στους διακομιστές μας. Περιέχουν μόνο προτίμηση γλώσσας ή θέματος και κανένα προσωπικό ή ταυτοποιητικό δεδομένο. Μπορείτε να τις διαγράψετε ανά πάσα στιγμή μέσω των ρυθμίσεων του browser σας.",scriptHeading:"Scripts και εξωτερικοί πόροι",scripts:[{name:"Γραμματοσειρές (αυτοφιλοξενούμενες)",layer:"Πρώτο μέρος",purpose:"Οι γραμματοσειρές του ιστότοπου (Commissioner, IBM Plex Sans, JetBrains Mono) εξυπηρετούνται από τον ίδιο τον διακομιστή του ιστότοπου. Δεν γίνεται κανένα αίτημα γραμματοσειρών προς την Google ή άλλο τρίτο μέρος.",provider:"IonianDTwin — ioniandtwin.di.ionio.gr"},{name:"Χάρτες (CARTO / OpenStreetMap)",layer:"Τρίτο μέρος",purpose:"Φορτώνει τα διαδραστικά tiles του βασικού χάρτη για τον χάρτη του Ψηφιακού Διδύμου. Η συσκευή σας ζητά εικόνες tiles από το CDN της CARTO, το οποίο ενδέχεται να δει τη διεύθυνση IP σας και τα tiles που προβάλλετε.",provider:"basemaps.cartocdn.com / openstreetmap.org"},{name:"Φόρμα επικοινωνίας",layer:"Πρώτο μέρος",purpose:"Συλλέγει τα δεδομένα που υποβάλλετε (ονοματεπώνυμο, email, οργανισμός, μήνυμα) αποκλειστικά για την απάντηση στο αίτημά σας. Δεν αποθηκεύονται δεδομένα σε cookies ούτε διαβιβάζονται σε τρίτους.",provider:"Κοινοπραξία IonianDTwin"}],scriptNote:"Δεν φορτώνονται scripts διαφήμισης, αναλυτικής, remarketing ή κοινωνικών δικτύων σε αυτόν τον ιστότοπο. Η φόρμα επικοινωνίας εξυπηρετείται χειροκίνητα από την κοινοπραξία και δεν συνδέεται με καμία πλατφόρμα αναλυτικής.",dpoLink:"Επικοινωνία με τον Υπεύθυνο Προστασίας Δεδομένων του Ιονίου Πανεπιστημίου",dpoUrl:"https://gdpr.ionio.gr/"},notFound:{tag:"404 · Εκτός χάρτη",titleA:"Η σελίδα",titleB:"δεν βρέθηκε.",lede:"Η σελίδα που αναζητάτε δεν υπάρχει ή το αντικείμενό της δεν είναι πλέον διαθέσιμο. Επιστρέψτε στην αρχική σελίδα για να συνεχίσετε την πλοήγησή σας.",back:"Επιστροφή στην αρχική",contact:"Επικοινωνία"},dash:{sustainability:"Δείκτης βιωσιμότητας",watch:"Προσοχή",indicators:"34 δείκτες",categories:"10 κατηγορίες",updated:"Ενημερώθηκε 12 δευτ. πριν",aqi:"Δείκτης ποιότητας αέρα",crowd:"Δείκτης πλήθους · Κέρκυρα",seaTemp:"Θερμοκρασία Ιονίου",alerts:"Ενεργές ειδοποιήσεις",forecast:"Προοπτική βιωσιμότητας · πρόβλεψη 14 ημερών",observed:"παρατηρημένο",forecasted:"πρόβλεψη",confidence:"βεβαιότητα",sources:"Πηγές · αισθητήρες · CAMS · MarineTraffic · Flightradar24",intensity:"Ένταση δείκτη",low:"ΧΑΜΗΛΟ",watchLow:"ΠΡΟΣΟΧΗ",alert:"ΣΥΝΑΓΕΡΜΟΣ",disclaimer:"Προσομοιωμένη προεπισκόπηση · ενδεικτικά δεδομένα — βασικός χάρτης © OpenStreetMap · CARTO",layers:{environment:"Περιβάλλον",transport:"Μεταφορές",infrastructure:"Υποδομές"},islandLabels:["ΚΕΡΚΥΡΑ","ΠΑΞΟΙ","ΛΕΥΚΑΔΑ","ΚΕΦΑΛΟΝΙΑ","ΙΘΑΚΗ","ΖΑΚΥΝΘΟΣ"],today:"ΣΗΜΕΡΑ"},llm:{title:"Νοημοσύνη Διδύμου",sub:"RAG → NL-to-SQL → λίμνη δεδομένων",preview:"D7 · προεπισκόπηση",greeting:"Καλημέρα. Είμαι η διεπαφή φυσικής γλώσσας του διδύμου — ρωτήστε με ο,τιδήποτε για το περιβάλλον, τα οικοσυστήματα ή την προοπτική των Ιονίων Νήσων.",thinking:"Αναζήτηση στη λίμνη δεδομένων…",placeholder:"Ρωτήστε για ποιότητα αέρα, οικοσυστήματα, προβλέψεις…",send:"Αποστολή",fallback:"Κατά την ανάπτυξη, αυτή η διεπαφή θα εκτελεί ζωντανό αγωγό RAG πάνω στη λίμνη δεδομένων της πλατφόρμας — μεταφράζοντας τη φυσική γλώσσα σε SQL. Σε αυτή την προεπισκόπηση, δοκιμάστε μία από τις προτεινόμενες ερωτήσεις για να δείτε πώς μοιάζει μια εκπαιδευμένη απάντηση.",qa:[{q:"Ποιες τοποθεσίες υπέρβασαν περιβαλλοντικά κατώφλια αυτή την εβδομάδα;",a:"Τρεις παρακολουθούμενες ζώνες υπέρβασαν τα κατώφλιά τους τις τελευταίες 7 ημέρες. Η Γλυφάδα (Κέρκυρα) έφτασε στο 118% της φέρουσας ικανότητάς της στις 9 Αυγούστου. Η Παλαιοκαστρίτσα παρέμεινε πάνω από το κατώφλι για 3 συνεχείς ημέρες, ενώ το Ναυάγιο (Ζάκυνθος) ξεπέρασε το 96% μία φορά. Προτείνω στοχευμένες παρεμβάσεις μέσω της ροής εναλλακτικών δραστηριοτήτων της εφαρμογής.",stats:[{k:"Μέγιστο Γλυφάδας",v:"118%"},{k:"Ημέρες ζώνης πάνω από κατώφλι",v:"9"},{k:"Ενεργά σημεία",v:"3"}],sources:["Αισθητήρες πλήθους","Sentinel-1 SAR","Αναφορές πολιτών"]},{q:"Πώς εξελίσσεται η ποιότητα του αέρα στην πόλη της Κέρκυρας;",a:"Βελτιώνεται σε σχέση με τον Ιούλιο. Τα PM10 μειώθηκαν κατά 12% σε μηνιαία βάση (31 → 27 µg/m³), το NO₂ παραμένει στα 19 µg/m³ και το όζον εντός των ευρωπαϊκών στόχων. Ο σύνθετος δείκτης AQI ανέρχεται σε 41, δηλαδή σε μέτριο επίπεδο. Το μοντέλο μηχανικής μάθησης αποδίδει περίπου το 38% της διακύμανσης στην κυκλοφορία (R² = 0.38).",stats:[{k:"Μεταβολή PM10",v:"−12%"},{k:"Σύνθετος AQI",v:"41/100"},{k:"R² κυκλοφορίας",v:"0.38"}],sources:["Αισθητήρες αέρα IoT","Copernicus CAMS","OpenWeather"]},{q:"Ποια είναι η περιβαλλοντική προοπτική για την Κεφαλονιά το προσεχές σαββατοκύριακο;",a:"Αυξημένη πίεση — σύνθετος δείκτης 0.71, ζώνη προσοχής. Οι αφίξεις προβλέπονται αυξημένες κατά 14% σε εβδομαδιαία βάση, με 12 προγραμματισμένα πλοία και περίπου 38 καθημερινές πτήσεις. Προτεινόμενες ενέργειες: προκατανομή μέσων συλλογής αποβλήτων στο Αργοστόλι και ενίσχυση της παρακολούθησης στη Μύρτο.",stats:[{k:"Δείκτης πίεσης",v:"0.71"},{k:"Μεταβολή αφίξεων εβδ.",v:"+14%"},{k:"Πλοία · πτήσεις/ημέρα",v:"12 · 38"}],sources:["MarineTraffic","Flightradar24","Πρόβλεψη ΜΜ"]},{q:"Συγκρίνετε τη βιωσιμότητα στα νησιά του Ιονίου.",a:"Σύνθετες βαθμολογίες βιωσιμότητας: Ιθάκη 0.81, Παξοί 0.74, Κεφαλονιά 0.66, Λευκάδα 0.63, Ζάκυνθος 0.55, Κέρκυρα 0.48. Η βαθμολογία της Κέρκυρας επηρεάζεται από τους δείκτες πλήθους και αποβλήτων, ενώ της Ζακύνθου από τη θολότητα των παράκτιων υδάτων στο Ναυάγιο.",stats:[{k:"Καλύτερη · Ιθάκη",v:"0.81"},{k:"Χειρότερη · Κέρκυρα",v:"0.48"},{k:"Κατηγορίες GSTC",v:"10"}],sources:["Δείκτης GSTC v2.0","Και οι 12 πηγές"]}]}},lb=[{name:"Ithaca",greek:"Ithaki",score:81,note:"Low-impact seasonality and strong community stewardship of heritage assets"},{name:"Paxi",greek:"Paxos",score:74,note:"Compact land mass rewards careful visitor distribution and marine protection"},{name:"Kefalonia",greek:"Kefalonia",score:66,note:"Dispersed seasonality supports balance; protected Caretta-caretta nesting sites monitored"},{name:"Lefkada",greek:"Lefkada",score:63,note:"Coastal dune and Posidonia meadow conservation alongside managed beach access"},{name:"Zakynthos",greek:"Zakynthos",score:55,note:"Marine protected areas around Navagio and Laganas under active restoration focus"},{name:"Corfu",greek:"Kerkyra",score:48,note:"Regional flagship pilot — the largest opportunity to demonstrate measurable improvement"}],rb=[{icon:kc,title:"Nature & ecosystems",body:"Posidonia seagrass meadows, coastal dunes and maquis habitat that anchor the islands' identity — monitored for extent, condition and disturbance so protection can be targeted, not blanket.",impact:"Conservation that adapts"},{icon:xh,title:"Water resources",body:"A Mediterranean island reality: scarce supply meeting peak seasonal demand. The twin tracks quality, turbidity and abstraction to keep bathing and drinking water within safe limits.",impact:"Resources kept in balance"},{icon:Mc,title:"Energy & carbon",body:"Abundant sun and wind meet a demand curve that spikes each summer. Measuring the renewable share and the shape of that peak is the first step to flattening it.",impact:"A credible path to net zero"},{icon:_h,title:"Waste & circularity",body:"Per-visitor waste, recycling rates and single-use plastics, measured honestly — so circular-economy investment can be directed where it actually moves the number.",impact:"Less, reused, recovered"},{icon:mh,title:"Biodiversity",body:"Sentinel-2 vegetation indices, habitat disturbance alerts and invasive-species signals give the region an early-warning system for the ecosystems that underpin its economy.",impact:"Early warning, not hindsight"},{icon:Pr,title:"Culture & community",body:"Living heritage, historic town cores and the residents who sustain them. Sustainability is only real when the benefit stays local and the place keeps its character.",impact:"Benefit that stays local"}],ob=[{n:"01",title:"Build the Digital Twin",body:"A multi-layer geospatial twin integrating environmental, transport and digital-infrastructure monitoring for the entire Ionian region."},{n:"02",title:"Integrate open and system data",body:"Combine open web data, Earth Observation and existing maritime, aviation, weather and traffic systems. Ten indoor collection stations provide complementary local measurements."},{n:"03",title:"Fuse heterogeneous data",body:"Satellite (Copernicus), maritime (MarineTraffic), aviation (FlightRadar24), weather, traffic and crowdsourced citizen reports — one data lake."},{n:"04",title:"Model with ML/AI",body:"Predictive analytics, anomaly detection and tourism-flow forecasting that link visitor activity to environmental outcomes."},{n:"05",title:"Democratise access via LLM",body:"A natural-language interface that lets any stakeholder query the twin conversationally — no GIS expertise required."},{n:"06",title:"Measure what matters",body:"34 sustainability indicators across 10 categories, aligned with GSTC Destination Criteria v2.0."},{n:"07",title:"Put it in every pocket",body:"A mobile app for citizens and visitors: real-time alerts, crowdsourcing and alternative-activity recommendations."},{n:"08",title:"Leave no one behind",body:"WCAG 2.0 Level AA and Greek Law 4074/2012 accessibility compliance across every digital touchpoint."}],cb=[{id:"presentation",index:"05",name:"Presentation Layer",tag:"Where people meet the twin",desc:"Three coordinated front doors into the platform: a full GIS web dashboard for analysts and policymakers, a mobile companion for citizens and visitors, and a conversational LLM interface for everyone else.",components:[{name:"Web Dashboard",desc:"GIS maps, heatmaps, layered overlays and trend analytics in the browser."},{name:"Mobile App",desc:"iOS/Android companion with alerts, crowdsourcing and offline-first design."},{name:"LLM Query Interface",desc:"Natural-language questions translated to SQL against the data lake."}],tech:["React / Vue","Mapbox GL · Leaflet","D3 · Chart.js","React Native / Flutter"]},{id:"analytics",index:"04",name:"Analytics Layer",tag:"Where data becomes foresight",desc:"The intelligence of the twin: machine-learning models that detect anomalies, forecast conditions, and compute the composite Sustainability Index against GSTC v2.0.",components:[{name:"ML Models",desc:"Anomaly detection and supervised learning over fused environmental–tourism data."},{name:"Predictive Analytics",desc:"Time-series forecasting of visitor pressure, pollution and infrastructure load."},{name:"GSTC v2.0 Index",desc:"Composite index computation across 34 indicators and 10 categories."}],tech:["scikit-learn","TensorFlow / PyTorch","Prophet · time-series","Hugging Face"]},{id:"processing",index:"03",name:"Data Processing Layer",tag:"Where streams become structure",desc:"Real-time stream processing alongside batch ETL, with spatial analytics served through PostGIS and GeoServer into every client.",components:[{name:"Stream Processing",desc:"Continuous ingestion and windowing of high-frequency feeds from open services, existing systems and complementary local measurements."},{name:"ETL / Batch",desc:"Cleansing, harmonising and joining slower statistical and satellite sources."},{name:"Spatial Analytics",desc:"PostGIS geometry operations and OGC services via GeoServer."}],tech:["Apache Kafka","Apache Spark","Apache Flink","PostGIS · GeoServer"]},{id:"ingestion",index:"02",name:"Data Ingestion Layer",tag:"Where the world streams in",desc:"Twelve heterogeneous feeds — open web services, orbit, sea, sky, road and citizen sources — normalised into a single spatio-temporal data model.",components:[{name:"Earth Observation",desc:"Copernicus CAMS, CMEMS, Sentinel-1 SAR and Sentinel-2 optical."},{name:"Mobility Feeds",desc:"PeopleFlows movement data, MarineTraffic vessel positions, FlightRadar24 arrivals and Google traffic."},{name:"Citizen & Official",desc:"Crowdsourced reports from the mobile app, EU Tourism Dashboard statistics."}],tech:["MQTT broker","LoRaWAN server","REST / API connectors","Copernicus CDSE"]},{id:"physical",index:"01",name:"Data Collection / Sensor Layer",tag:"Where the twin touches ground",desc:"Open web data and existing systems form the primary foundation of the twin. Ten indoor collection stations provide complementary local observations for selected air-quality, water-quality and crowd-density indicators.",components:[{name:"Open and system data",desc:"Public web sources, Earth Observation, maritime, aviation, weather and traffic systems provide the main data foundation."},{name:"Ten indoor collection stations",desc:"Complementary local observations for selected air-quality, water-quality and crowd-density indicators."},{name:"Privacy-preserving observations",desc:"Aggregated measurements and carefully governed collection methods support the twin without storing personal data."}],tech:["Battery + photovoltaic","NB-IoT / LoRaWAN","Edge processing","IP-protected optics"]}],ub=[{id:"air",name:"Air Quality",icon:Vx,color:"#C8502E",gstc:"D(c) Waste & Emissions",desc:"Atmospheric pollutant concentrations measured in-situ and cross-validated against Copernicus CAMS regional forecasts.",indicators:["O₃ concentration","PM2.5","PM10","CO₂","NOₓ","SO₂"],reading:"PM10 is the mass of airborne particles under 10 µm that can reach the lungs. 27 µg/m³ is a daily mean well below the 50 µg/m³ advisory line; only a sustained breach raises a public alert.",sample:{label:"PM10 · Corfu town",value:"27 µg/m³",threshold:"alert when PM10 > 50 µg/m³"}},{id:"water",name:"Water Quality",icon:xh,color:"#0F80C5",gstc:"D(b) Resource Management",desc:"Sea surface temperature, turbidity, chlorophyll-a and bacterial indicators from CMEMS and coastal stations.",indicators:["Sea surface temp","Turbidity","Chlorophyll-a","Coliform bacteria"],reading:"Chlorophyll-a is a proxy for phytoplankton and nutrient load. A coastal value of 0.42 mg/m³ indicates low nutrient pressure; 1.0 mg/m³ flags an increased risk of algal bloom.",sample:{label:"Chlorophyll-a · Glyfada",value:"0.42 mg/m³",threshold:"alert when chlorophyll-a > 1.0 mg/m³"}},{id:"noise",name:"Noise Pollution",icon:Ux,color:"#7C6FF0",gstc:"D(c) Waste & Emissions",desc:"Decibel levels at key cultural and natural sites, with temporal patterns across the season.",indicators:["dB levels at key sites","Night-time noise","Event peaks","Temporal patterns"],reading:"A-weighted decibels approximate how loud a sound feels to humans. A night-time level of 61 dB(A) in a historic square exceeds the 55 dB(A) guideline and may disturb sleep.",sample:{label:"Old Town square, 23:00",value:"61 dB(A)",threshold:"alert when night noise > 55 dB(A)"}},{id:"crowd",name:"Crowd Density",icon:Lc,color:"#E4B671",gstc:"A(c) Managing Pressure",desc:"Pedestrian flow, dwell times and zone occupancy from privacy-preserving optical counting — the twin's core pressure signal.",indicators:["Pedestrian flow rates","Dwell times","Zone occupancy","Carrying capacity %"],reading:"Occupancy is the share of a site's carrying capacity currently in use. At 92%, the Old Port exceeds the 85% comfort threshold, triggering rerouting recommendations and crowd-management action.",sample:{label:"Old Port · Corfu",value:"92% capacity",threshold:"alert when occupancy > 85%"}},{id:"transport",name:"Transport Pressure",icon:ph,color:"#5A6258",gstc:"D(f) Transport",desc:"Road congestion, public-transport uptake and parking occupancy fused from traffic APIs and maritime/aviation arrivals.",indicators:["Congestion index","Public transport usage","Parking occupancy","Ferry & flight volumes"],reading:"Port arrivals count scheduled ferry calls per day. Twelve calls remain below the 14-per-day saturation line, so quay and road handling are still within the modelled capacity.",sample:{label:"Corfu port arrivals",value:"12 ferries/day",threshold:"alert when arrivals > 14 ferries/day"}},{id:"energy",name:"Energy Consumption",icon:Mc,color:"#E79A1F",gstc:"D(b) Resource Management",desc:"Tourism-sector energy demand and the renewable share of supply across islands.",indicators:["Tourism-sector energy use","Renewable share","Peak demand","Grid stress hours"],reading:"Peak demand is the seasonal maximum grid load compared with a low-season baseline. A +38% August peak exceeds the +30% stress line, indicating reduced supply margin and local grid strain.",sample:{label:"Peak demand · August",value:"+38% vs. baseline",threshold:"alert when increase > 30%"}},{id:"waste",name:"Waste Generation",icon:_h,color:"#6B8A3E",gstc:"D(c) Waste & Emissions",desc:"Solid waste per visitor, recycling rates and single-use plastic prevalence across destinations.",indicators:["Solid waste per visitor","Recycling rates","Single-use plastics","Collection overflows"],reading:"Solid waste per visitor-day estimates the tourism-related disposal load. 2.1 kg per day is below the 2.5 kg alert line, but remains above a low-impact target.",sample:{label:"Waste / visitor-day",value:"2.1 kg",threshold:"alert when waste > 2.5 kg/day"}},{id:"biodiversity",name:"Biodiversity Impact",icon:mh,color:"#2F7D4A",gstc:"D(a) Conservation",desc:"NDVI vegetation trends from Sentinel-2, habitat disturbance indices and invasive-species alerts.",indicators:["NDVI trends","Habitat disturbance","Posidonia meadow health","Invasive species alerts"],reading:"The Normalised Difference Vegetation Index estimates green vegetation density from Sentinel-2 imagery. A 4.2% year-on-year decline beyond the 3% threshold signals possible habitat degradation at the dune sites.",sample:{label:"NDVI · dune sites",value:"−4.2% YoY",threshold:"alert when decline > 3% YoY"}},{id:"heritage",name:"Cultural Heritage",icon:Pr,color:"#B93807",gstc:"C(a) Cultural Heritage",desc:"Visitor counts at monuments, structural monitoring and heritage-condition indices for the islands' historic assets.",indicators:["Site visitor counts","Structural monitoring","Heritage condition index","Carrying capacity"],reading:"Daily visitor throughput is a proxy for physical pressure on a monument. 6,400 visits remain below the 7,000-per-day conservation limit, keeping footfall within the modelled tolerance.",sample:{label:"Old Fortress · daily",value:"6,400 visitors",threshold:"alert when visitors > 7,000/day"}},{id:"socio",name:"Socio-Economic",icon:gh,color:"#0069B8",gstc:"B(a) Economic Benefits",desc:"Visitor expenditure, local employment and the distribution of tourism's economic benefit across communities.",indicators:["Visitor expenditure","Local employment","Benefit distribution","Season length"],reading:"Average expenditure per visitor-day estimates how much tourism value remains in the local economy. At €142, the destination exceeds the €120 target, indicating meaningful local retention.",sample:{label:"Avg. spend / visitor-day",value:"€142",threshold:"target: ≥ €120/visitor-day"}}],db=[{layer:"Frontend — Web",tech:["React / Vue.js","Mapbox GL","Leaflet","D3.js","Chart.js"],desc:"Accessible, map-first dashboards"},{layer:"Frontend — Mobile",tech:["React Native / Flutter","Push notifications","Offline-first"],desc:"Citizen & visitor companion"},{layer:"Backend",tech:["Python · FastAPI","Django","Node.js microservices"],desc:"APIs and service orchestration"},{layer:"GIS & Spatial",tech:["PostGIS","GeoServer","QGIS","Google Earth Engine"],desc:"The spatial nervous system"},{layer:"Data Processing",tech:["Apache Kafka","Apache Spark","Apache Flink"],desc:"Streaming and batch pipelines"},{layer:"Databases",tech:["PostgreSQL + PostGIS","TimescaleDB","Elasticsearch"],desc:"Spatial, time-series and search"},{layer:"ML / AI",tech:["scikit-learn","TensorFlow / PyTorch","Hugging Face"],desc:"Forecasting and anomaly detection"},{layer:"LLM Interface",tech:["RAG — LangChain / LlamaIndex","NL-to-SQL","Data warehouse"],desc:"Conversational access to the twin"},{layer:"IoT Ingestion",tech:["MQTT broker","LoRaWAN network server","Azure / AWS IoT Hub"],desc:"Sensor-to-cloud connectivity"},{layer:"Satellite Data",tech:["Copernicus CDSE","Sentinel Hub","Google Earth Engine"],desc:"Orbit-scale observation"},{layer:"Cloud & Hosting",tech:["EU cloud (GDPR)","Kubernetes / OpenShift"],desc:"European, sovereign by design"},{layer:"Monitoring & Ops",tech:["Prometheus","Grafana","Email · push · SMS alerts"],desc:"Keep-the-lights-on layer"}],hb=[{id:"D1",name:"Data Collection and Integration",desc:"Integration of open web data, existing systems and ten indoor collection stations for selected environmental observations.",phase:"2027 · H1"},{id:"D2",name:"Data Ingestion Platform",desc:"Unified pipeline for all heterogeneous streams — satellite, maritime, aviation, weather, traffic and crowdsourced.",phase:"2027 · H2"},{id:"D3",name:"Digital Twin Web Dashboard",desc:"Multi-layer GIS platform with real-time overlays, heatmaps and trend aste, biodiversity and cultural heritage. EU co-funded under the Ionian Islands 2021–2027 programme."},"/about/challenge":{titleEl:"Η πρόκληση της βιωσιμότητας στα Ιόνια Νησιά — IonianDTwin",titleEn:"The sustainability challenge in the Ionian Islands — IonianDTwin",descEl:"Στην καλοκαιρινή αιχμή, η επισκεψιμότητα πιέζει τις υποδομές ύδρευσης, ενέργειας και μεταφορών, τις ακτές και τα θαλάσσια οικοσυστήματα, καθώς και την καθημερινότητα των μόνιμων κατοίκων. Τα διαθέσιμα στοιχεία είναι συνήθως αποσπασματικά και στατικά — το IonianDTwin τα αντικαθιστά με συνεχή, μετρήσιμη παρακολούθηση.",descEn:"At the summer peak, visitor numbers strain water, energy and transport infrastructure, beaches and marine ecosystems, and residents' daily life. Available evidence is usually fragmented and static — IonianDTwin replaces it with continuous, measurable monitoring."},"/about/project":{titleEl:"Το έργο IonianDTwin — IonianDTwin",titleEn:"The IonianDTwin project — IonianDTwin",descEl:"«IonianDTwin: Ψηφιακό Δίδυμο για τη Δυναμική Μοντελοποίηση και την Ευφυή Εξισορρόπηση της Αστικής Βιωσιμότητας και του Τουρισμού των Ιονίων Νήσων». Σκοπός: να αποκτήσουν η Περιφέρεια, οι Δήμοι, οι επιχειρήσεις και οι πολίτες ένα κοινό εργαλείο που δείχνει με μετρήσιμα δεδομένα πώς επηρεάζει ο τουρισμός τα νησιά.",descEn:"“IonianDTwin: Digital Twin for the Dynamic Modelling and Intelligent Balancing of Urban Sustainability and Tourism in the Ionian Islands”. Goal: give the Region, municipalities, businesses and citizens a shared tool showing — with measurable data — how tourism affects the islands."},"/about/architecture":{titleEl:"Αρχιτεκτονική του Ψηφιακού Διδύμου — IonianDTwin",titleEn:"Digital Twin architecture — IonianDTwin",descEl:"Πέντε συνεργαζόμενα επίπεδα: συλλογή δεδομένων (αισθητήρες, Copernicus, λιμάνια, αεροδρόμια), λίμνη δεδομένων και διαλειτουργικότητα, μηχανές δεικτών και μοντέλων, γεωχωρικές υπηρεσίες GIS και τρεις διεπαφές — πίνακας ελέγχου, κινητή εφαρμογή και διεπαφή φυσικής γλώσσας.",descEn:"Five cooperating layers: data capture (sensors, Copernicus, ports, airports), data lake and interoperability, indicator and model engines, geospatial GIS services, and three interfaces — dashboard, mobile app and natural-language access."},"/about/technology":{titleEl:"Τεχνολογίες: Copernicus, μηχανική μάθηση, LLM — IonianDTwin",titleEn:"Technologies: Copernicus, machine learning, LLMs — IonianDTwin",descEl:"Δορυφορικά δεδομένα Copernicus (Sentinel, CAMS, CMEMS), επίγειοι αισθητήρες και ανοικτές πηγές τροφοδοτούν μοντέλα μηχανικής μάθησης για πρόβλεψη ζήτησης, συμφόρησης και φόρτου υποδομών. Μεγάλα Γλωσσικά Μοντέλα με ανάκτηση (RAG) απαντούν σε ερωτήσεις με απλή γλώσσα.",descEn:"Copernicus satellite data (Sentinel, CAMS, CMEMS), ground sensors and open sources feed machine-learning models forecasting demand, congestion and infrastructure load. Retrieval-augmented Large Language Models answer questions in plain language."},"/platform":{titleEl:"Η πλατφόρμα IonianDTwin — IonianDTwin",titleEn:"The IonianDTwin platform — IonianDTwin",descEl:"Μία κεντρική πλατφόρμα παρακολούθησης, πρόβλεψης και ειδοποίησης για την Περιφέρεια και τους Δήμους, συνοδευόμενη από κινητή εφαρμογή για πολίτες και επισκέπτες και από ευφυή διεπαφή ερωτήσεων. Πιλοτική δοκιμή σε πραγματικές συνθήκες κατά την τουριστική περίοδο.",descEn:"One central monitoring, forecasting and alerting platform for the Region and municipalities, plus a mobile app for citizens and visitors and an intelligent query interface. Pilot-tested under real conditions during the tourist season."},"/platform/dashboard":{titleEl:"Πίνακας ελέγχου σε πραγματικό χρόνο — IonianDTwin",titleEn:"Real-time dashboard — IonianDTwin",descEl:"Διαδραστικός γεωχωρικός πίνακας: χάρτης των Ιονίων με σταθμούς παρακολούθησης, θερμικοί χάρτες πίεσης, χρονοσειρές δεικτών, προβλέψεις και ειδοποιήσεις κατωφλίων — με φίλτρα ανά νησί, θεματικό επίπεδο και χρονικό ορίζοντα.",descEn:"Interactive geospatial dashboard: Ionian map with monitoring stations, pressure heatmaps, indicator time series, forecasts and threshold alerts — filterable by island, thematic layer and time horizon."},"/platform/mobile-app":{titleEl:"Κινητή εφαρμογή για πολίτες και επισκέπτες — IonianDTwin",titleEn:"Mobile app for citizens and visitors — IonianDTwin",descEl:"Ενημέρωση και ειδοποιήσεις για περιβαλλοντικές συνθήκες και συμφόρηση, προτάσεις εναλλακτικών χαμηλής πίεσης και συμμετοχική συνεισφορά δεδομένων από τους ίδιους τους χρήστες — ο πολίτης ως αισθητήρας.",descEn:"Updates and alerts on environmental conditions and congestion, low-pressure alternative suggestions, and participatory data contribution by users themselves — the citizen as a sensor."},"/platform/intelligence":{titleEl:"Τεχνητή νοημοσύνη και ερωτήσεις σε φυσική γλώσσα — IonianDTwin",titleEn:"Artificial intelligence and natural-language questions — IonianDTwin",descEl:"Ρωτήστε το δίδυμο με απλά λόγια: «Ποιες παραλίες πιέζονται περισσότερο αυτό το Σαββατοκύριακο;». Η μηχανή RAG συνδυάζει ζωντανά δεδομένα και τεκμηρίωση δεικτών και απαντά με πηγές, διαγράμματα και χάρτες.",descEn:"Ask the twin in plain words: “Which beaches are most pressured this weekend?”. The RAG engine combines live data with indicator documentation and answers with sources, charts and maps."},"/indicators":{titleEl:"34 δείκτες βιωσιμότητας, ευθυγραμμισμένοι με το GSTC — IonianDTwin",titleEn:"34 sustainability indicators, aligned with GSTC — IonianDTwin",descEl:"Ποιότητα αέρα και ύδατος, θόρυβος, πυκνότητα πλήθους, μεταφορές, ενέργεια, απόβλητα, βιοποικιλότητα, πολιτιστική κληρονομιά και κοινωνικο-οικονομικά μεγέθη — 34 δείκτες ευθυγραμμισμένοι με τα διεθνή κριτήρια του Global Sustainable Tourism Council (GSTC).",descEn:"Air and water quality, noise, crowd density, transport, energy, waste, biodiversity, cultural heritage and socio-economic metrics — 34 indicators aligned with the Global Sustainable Tourism Council (GSTC) criteria."},"/resources/data-sources":{titleEl:"Περισσότερες από 25 πηγές δεδομένων — IonianDTwin",titleEn:"More than 25 data sources — IonianDTwin",descEl:"Copernicus (αέρας, θάλασσα, βλάστηση), ύδατα κολύμβησης, μικροκλίμα, αφίξεις αεροδρομίων και λιμανιών, πληρότητα παραλιών, κυκλοφορία, κάλυψη κινητής και οικονομικά στοιχεία τουρισμού — ενοποιημένα σε ενιαίο γεωχωρικό μοντέλο.",descEn:"Copernicus (air, sea, vegetation), bathing waters, microclimate, airport and port arrivals, beach occupancy, traffic, mobile coverage and tourism economics — unified in a single geospatial model."},"/resources/related-projects":{titleEl:"Συναφή έργα και συνέργειες — IonianDTwin",titleEn:"Related projects and synergies — IonianDTwin",descEl:"Το IonianDTwin συνομιλεί με ευρωπαϊκές και εθνικές πρωτοβουλίες για ψηφιακά δίδυμα προορισμών, βιώσιμο τουρισμό και παρατήρηση Γης — από το Destination Earth μέχρι περιφερειακά παρατηρητήρια.",descEn:"IonianDTwin connects with European and national initiatives on destination digital twins, sustainable tourism and Earth observation — from Destination Earth to regional observatories."},"/resources/references":{titleEl:"Βιβλιογραφία και πρότυπα — IonianDTwin",titleEn:"Bibliography and standards — IonianDTwin",descEl:"GSTC Destination Criteria v2.0, τεκμηρίωση Copernicus (CAMS, CMEMS, CLMS), μεθοδολογίες φέρουσας ικανότητας και βασική βιβλιογραφία για ψηφιακά δίδυμα και βιώσιμο τουρισμό.",descEn:"GSTC Destination Criteria v2.0, Copernicus documentation (CAMS, CMEMS, CLMS), carrying-capacity methodologies and core literature on digital twins and sustainable tourism."},"/blog":{titleEl:"Νέα, ανακοινώσεις και Δελτία Τύπου — IonianDTwin",titleEn:"News, announcements and press releases — IonianDTwin",descEl:"Επίσημο Δελτίο Τύπου έναρξης του έργου, επιστημονικές ανακοινώσεις για τους δείκτες GSTC και την παρατήρηση Γης, τεχνολογικές ενημερώσεις για AI και πιλοτικές εφαρμογές στα νησιά.",descEn:"Official project launch press release, scientific updates on GSTC indicators and Earth observation, technology briefings on AI, and island pilot deployments."},"/contact":{titleEl:"Επικοινωνία με την ομάδα του έργου — IonianDTwin",titleEn:"Contact the project team — IonianDTwin",descEl:"Τμήμα Πληροφορικής, Ιόνιο Πανεπιστήμιο — Επιστημονικός Υπεύθυνος: Καθηγητής Εμμανουήλ Μάγκος. Φόρμα επικοινωνίας και στοιχεία για φορείς, επιχειρήσεις και ερευνητές.",descEn:"Department of Informatics, Ionian University — Scientific Coordinator: Professor Emmanouel Magkos. Contact form and details for authorities, businesses and researchers."},"/privacy":{titleEl:"Απόρρητο και προστασία δεδομένων — IonianDTwin",titleEn:"Privacy and data protection — IonianDTwin",descEl:"Πώς συλλέγονται και προστατεύονται τα δεδομένα: ανωνυμοποίηση, συγκατάθεση, δικαιώματα υποκειμένων και συμμόρφωση με τον ΓΚΠΔ (GDPR) σε όλες τις διεπαφές του έργου.",descEn:"How data is collected and protected: anonymisation, consent, data-subject rights and GDPR compliance across all project interfaces."}},Ob="https://ioniandtwin.di.ionio.gr";function Bb(d){return d.replace(/\/+$/,"")||"/"}function Pb(d){let c=document.head.querySelector('link[rel="canonical"]');c||(c=document.createElement("link"),c.setAttribute("rel","canonical"),document.head.appendChild(c)),c.setAttribute("href",d)}function ji(d,c,f,h){const y=`meta[${d}="${c}"]${h==="en"?'[lang="en"]':h==="el"?":not([lang])":""}`;let v=document.head.querySelector(y);v||(v=document.createElement("meta"),v.setAttribute(d,c),h==="en"&&v.setAttribute("lang",h),document.head.appendChild(v)),v.setAttribute("content",f)}function Ib(){const{lang:d}=Pa(),{pathname:c}=on();return T.useEffect(()=>{const f=Bb(c),h=Rb[f];if(!h)return;const x=`${Ob}${f==="/"?"":`${f}/`}`,y=d==="en"?h.titleEn:h.titleEl;document.title=y,Pb(x),ji("property","og:url",x),ji("name","twitter:url",x),ji("property","og:title",y),ji("name","twitter:title",y),ji("property","og:description",d==="en"?h.descEn:h.descEl),ji("name","twitter:description",d==="en"?h.descEn:h.descEl),ji("name","description",h.descEl,"el"),ji("name","descr ιώσιμο τουρισμό",en:"A “digital twin” for the Ionian Islands: Ionian University launches the IonianDTwin project for sustainable tourism"},subtitle:{el:"«IonianDTwin: Ψηφιακό Δίδυμο για τη Δυναμική Μοντελοποίηση και την Ευφυή Εξισορρόπηση της Αστικής Βιωσιμότητας και του Τουρισμού των Ιονίων Νήσων»",en:"“IonianDTwin: Digital Twin for the Dynamic Modelling and Intelligent Balancing of Urban Sustainability and Tourism in the Ionian Islands”"},excerpt:{el:"Δεδομένα από δορυφόρους, αεροδρόμια, λιμάνια και ανοικτές πηγές θα δείχνουν έγκαιρα πού και πότε ο τουρισμός πιέζει τα νησιά, ώστε τα μέτρα να λαμβάνονται πριν η πίεση γίνει πρόβλημα.",en:"Data from satellites, airports, ports and open sources will show early where and when tourism is pressuring the islands, so that measures are taken before pressure turns into a problem."},lead:{el:"Το Τμήμα Πληροφορικής του Ιονίου Πανεπιστημίου ξεκίνησε την υλοποίηση του ερευνητικού έργου «IonianDTwin: Ψηφιακό Δίδυμο για τη Δυναμική Μοντελοποίηση και την Ευφυή Εξισορρόπηση της Αστικής Βιωσιμότητας και του Τουρισμού των Ιονίων Νήσων». Σκοπός του έργου είναι να αποκτήσουν η Περιφέρεια, οι Δήμοι, οι επιχειρήσεις και οι πολίτες ένα κοινό εργαλείο που δείχνει με μετρήσιμα δεδομένα πώς επηρεάζει ο τουρισμός τα νησιά. Έτσι η τουριστική ανάπτυξη θα μπορεί να συμβαδίζει με την προστασία του περιβάλλοντος και την ποιότητα ζωής των κατοίκων.",en:"The Department of Informatics of the Ionian University has launched the research project “IonianDTwin: Digital Twin for the Dynamic Modelling and Intelligent Balancing of Urban Sustainability and Tourism in the Ionian Islands”. The project aims to give the Region, municipalities, businesses and citizens a shared tool that shows, with measurable data, how tourism affects the islands — so that tourism growth can go hand in hand with environmental protection and residents’ quality of life."},highlights:{el:[{label:"Κωδικός ΟΠΣ",value:"6061866"},{label:"Απόφαση Ένταξης",value:"Αρ. 34822"},{label:"Δημόσια Δαπάνη",value:"€239.900,00"},{label:"Χρηματοδότηση",value:"100% ΕΤΠΑ"},{label:"Δείκτες Βιωσιμότητας",value:"34 Δείκτες GSTC"},{label:"Ψηφιακές Ροές",value:"25+ Ροές Δεδομένων"}],en:[{label:"OPS Code",value:"6061866"},{label:"Inclusion Decision",value:"No. 34822"},{label:"Public Budget",value:"€239,900.00"},{label:"Co-financing",value:"100% ERDF"},{label:"Sustainability",value:"34 GSTC Indicators"},{label:"Digital Feeds",value:"25+ Live Streams"}]},fundingBox:{title:{el:"Στοιχεία Συγχρηματοδότησης Πράξης",en:"Project Financing & Institutional Framework"},programme:{el:"Περιφερειακό Πρόγραμμα «Ιόνια Νησιά 2021–2027»",en:'Regional Operational Programme "Ionian Islands 2021–2027"'},objective:{el:"Άξονας: Έρευνα, Τεχνολογική Ανάπτυξη & Καινοτομία (Ειδικός Στόχος RSO 1.1)",en:"Priority Axis: Research, Technological Development & Innovation (Specific Objective RSO 1.1)"},budget:"€239.900,00 (100% Ευρωπαϊκό Ταμείο Περιφερειακής Ανάπτυξης - ΕΤΠΑ)",beneficiary:{el:"Ιόνιο Πανεπιστήμιο — Ειδικός Λογαριασμός Κονδυλίων Έρευνας (ΕΛΚΕ)",en:"Ionian University — Special Account for Research Funds (ELKE)"}},sections:[{title:{el:"Η πρόκληση",en:"The challenge"},paragraphs:{el:["Τα Ιόνια Νησιά είναι από τους δημοφιλέστερους προορισμούς διεθνώς. Στην καλοκαιρινή αιχμή, η επισκεψιμότητα πιέζει τις υποδομές ύδρευσης, ενέργειας και μεταφορών, τις ακτές και τα θαλάσσια οικοσυστήματα, καθώς και την καθημερινότητα των μόνιμων κατοίκων. Τα στοιχεία που είναι σήμερα διαθέσιμα για τη διαχείριση αυτής της πίεσης είναι συνήθως αποσπασματικά και στατικά."],en:["The Ionian Islands are among the world’s most popular destinations. At the summer peak, visitor numbers strain water, energy and transport infrastructure, beaches and marine ecosystems, as well as the daily life of permanent residents. The data currently available for managing this pressure is usually fragmented and static."]}},{title:{el:"Το ψηφιακό δίδυμο",en:"The digital twin"},paragraphs:{el:["Το IonianDTwin θα αναπτύξει ένα «ψηφιακό δίδυμο» του προορισμού, δηλαδή ένα διαρκώς ενημερούμενο ψηφιακό αντίγραφο των νησιών πάνω σε χάρτη. Θα συνδυάζει περισσότερες από 25 πηγές δεδομένων: ποιότητα αέρα και θάλασσας από το ευρωπαϊκό πρόγραμμα Copernicus, ύδατα κολύμβησης, μικροκλίμα, αφίξεις σε αεροδρόμια και λιμάνια, πληρότητα παραλιών, κυκλοφοριακή συμφόρηση, κάλυψη δικτύων κινητής και οικονομικά στοιχεία του τουρισμού. Από αυτά θα υπολογίζονται 34 δείκτες βιωσιμότητας, ευθυγραμμισμένοι με τα διεθνή κριτήρια του Global Sustainable Tourism Council (GSTC).","Μοντέλα μηχανικής μάθησης θα προβλέπουν την τουριστική ζήτηση, τη συμφόρηση και την επιβάρυνση των υποδομών. Μεγάλα Γλωσσικά Μοντέλα θα επιτρέπουν σε μη ειδικούς να αναζητούν πληροφορίες στο σύστημα με απλή, φυσική γλώσσα."],en:["IonianDTwin will develop a “digital twin” of the destination — a continuously updated digital copy of the islands on a map. It will combine more than 25 data sources: air and sea quality from the European Copernicus programme, bathing waters, microclimate, airport and port arrivals, beach occupancy, traffic congestion, mobile network coverage and tourism economic data. From these, 34 sustainability indicators will be computed, aligned with the international criteria of the Global Sustainable Tourism Council (GSTC).","Machine learning models will forecast tourism demand, congestion and infrastructure load. Large Language Models will allow non-experts to query the system in plain, natural language."]}},{title:{el:"Ποιοι ωφελούνται",en:"Who benefits"},paragraphs:{el:[],en:[]},cards:[{title:{el:"Η Περιφέρεια και οι Δήμοι",en:"The Region and Municipalities"},description:{el:"Μέσω μιας κεντρικής πλατφόρμας παρακολούθησης, πρόβλεψης και ειδοποίησης που θα στηρίζει τον σχεδιασμό παρεμβάσεων.",en:"Through a central monitoring, forecasting and alerting platform that will support the planning of interventions."}},{title:{el:"Οι πολίτες και οι επισκέπτες",en:"Citizens and visitors"},description:{el:"Μέσω μιας εφαρμογής για κινητά με ενημέρωση και ειδοποιήσεις για τις περιβαλλοντικές συνθήκες και τη συμφόρηση, στην οποία θα μπορούν και οι ίδιοι να συνεισφέρουν δεδομένα.",en:"Through a mobile app with updates and alerts on environmental conditions and congestion, to which they will themselves be able to contribute data."}},{title:{el:"Οι τουριστικές επιχειρήσεις",en:"Tourism businesses"},description:{el:"Με πρόσβαση σε αναλυτικά δεδομένα.",en:"With access to analytical data."}},{title:{el:"Η ερευνητική κοινότητα",en:"The research community"},description:{el:"Με ανωνυμοποιημένα ανοικτά δεδομένα.",en:"With anonymised open data."}}]},{title:{el:"Πιλοτική εφαρμογή και επόμενα βήματα",en:"Pilot deployment and next steps"},paragraphs:{el:["Η πλατφόρμα θα δοκιμαστεί πιλοτικά σε πραγματικές συνθήκες κατά τη διάρκεια της τουριστικής περιόδου.","Κατά τους πρώτους μήνες υλοποίησης, η ομάδα του έργου θα συναντηθεί με τους αρμόδιους φορείς για να οριστικοποιηθεί το πλαίσιο των δεικτών. Κατά τη διάρκεια του έργου θα γίνουν επίσης θεματικά εργαστήρια ανοικτά στην τοπική κοινωνία."],en:["The platform will be pilot-tested under real conditions during the tourist season.","During the first months of implementation, the project team will meet the competent bodies to finalise the indicator framework. Thematic workshops open to the local community will also take place during the project."]}},{title:{el:"Ταυτότητα έργου",en:"Project identity"},paragraphs:{el:[],en:[]},cards:[{title:{el:"Τίτλος πράξης",en:"Project title"},description:{el:"«IonianDTwin: Ψηφιακό Δίδυμο για τη Δυναμική Μοντελοποίηση και την Ευφυή Εξισορρόπηση της Αστικής Βιωσιμότητας και του Τουρισμού των Ιονίων Νήσων»",en:"“IonianDTwin: Digital Twin for the Dynamic Modelling and Intelligent Balancing of Urban Sustainability and Tourism in the Ionian Islands”"}},{title:{el:"Δικαιούχος",en:"Beneficiary"},description:{el:"Ειδικός Λογαριασμός Κονδυλίων Έρευνας Ιονίου Πανεπιστημίου",en:"Special Account for Research Funds of the Ionian University"}},{title:{el:"Φορέας υλοποίησης",en:"Implementing body"},description:{el:"Τμήμα Πληροφορικής, Ιόνιο Πανεπιστήμιο",en:"Department of Informatics, Ionian University"}},{title:{el:"Επιστημονικός Υπεύθυνος",en:"Scientific Coordinator"},description:{el:"Καθηγητής Εμμανουήλ Μάγκος",en:"Professor Emmanouel Magkos"}},{title:{el:"Κωδικός ΟΠΣ",en:"OPS Code"},description:{el:"6061866",en:"6061866"}},{title:{el:"Προϋπολογισμός",en:"Budget"},description:{el:"239.900,00 €",en:"€239,900.00"}},{title:{el:"Διάρκεια",en:"Duration"},description:{el:"01/09/2026 – 31/03/2029",en:"01/09/2026 – 31/03/2029"}},{title:{el:"Πρόγραμμα",en:"Programme"},description:{el:"«Ιόνια Νησιά 2021–2027» — Η πράξη συγχρηματοδοτείται από το Ευρωπαϊκό Ταμείο Περιφερειακής Ανάπτυξης.",en:"“Ionian Islands 2021–2027” — The project is co-funded by the European Regional Development Fund."}},{title:{el:"Ιστότοπος",en:"Website"},description:{el:"ioniandtwin.di.ionio.gr",en:"ioniandtwin.di.ionio.gr"}}]}]},{id:"02-gstc-sustainability-framework-ionian",slug:"gstc-sustainability-framework-ionian",type:"research",category:"research",featured:!1,date:{el:"15 Οκτωβρίου 2026",en:"October 15, 2026",iso:"2026-10-15"},location:{el:"Κέρκυρα",en:"Corfu, Greece"},author:{el:"Επιστημονική Ομάδα IonianDTwin",en:"IonianDTwin Scientific Team"},readTime:{el:"5 λεπτά ανάγνωσης",en:"5 min read"},tags:{el:["GSTC v2.0","Δείκτες Βιωσιμότητας","Φέρουσα Ικανότητα","Περιβαλλοντικό Αποτύπωμα"],en:["GSTC v2.0","Sustainability Indicators","Carrying Capacity","Environmental Footprint"]},title:{el:"Εναρμόνιση των 34 Δεικτών του IonianDTwin με το Διεθνές Πρότυπο GSTC v2.0",en:"Aligning IonianDTwin's 34 Indicators with the Global GSTC v2.0 Standard"},subtitle:{el:"Επιστημονική μεθοδολογία σύνδεσης κριτηρίων προορισμού με αυτοματοποιημένες ροές τηλεμετρίας",en:"Scientific methodology linking destination sustainability criteria to automated telemetry streams"},excerpt:{el:"Πώς η ερευνητική ομάδα του Ιονίου Πανεπιστημίου συσχέτισε 24 από τα 38 κριτήρια προορισμών του GSTC με αυτοματοποιημένες ροές τηλεμετρίας και δορυφορικής ανάλυσης.",en:"How the Ionian University research team mapped 24 out of 38 GSTC destination criteria to automated telemetry streams and Earth Observation satellite feeds."},lead:{el:"Το Παγκόσμιο Συμβούλιο Αειφόρου Τουρισμού (Global Sustainable Tourism Council - GSTC) ορίζει τα κορυφαία διεθνή πρότυπα για τη βιώσιμη διαχείριση προορισμών. Στο έργο IonianDTwin, οι 34 δυναμικοί δείκτες εναρμονίζονται πλήρως με τα 24 κρισιμότερα κριτήρια του GSTC v2.0, δομημένοι σε τέσσερις βασικούς πυλώνες.",en:"The Global Sustainable Tourism Council (GSTC) defines the premier international baseline criteria for sustainable destination stewardship. In IonianDTwin, 34 dynamic indicators align directly with 24 core GSTC v2.0 criteria across four foundational pillars."},sections:[{title:{el:"Οι Τέσσερις Πυλώνες του Προτύπου GSTC",en:"The Four Pillars of the GSTC Standard"},paragraphs:{el:["Κάθε δείκτης του συστήματος συνδέεται άμεσα με συγκεκριμένες πηγές ανοικτών δεδομένων και επίγειους αισθητήρες, προσφέροντας συνεχή παρακολούθηση της φέρουσας ικανότητας των νησιών."],en:["Each system indicator connects directly to verified open data streams and in-situ sensors, providing continuous oversight of island carrying capacities."]},cards:[{badge:{el:"Πυλώνας Α",en:"Pillar A"},title:{el:"Αειφόρος Διαχείριση Προορισμού",en:"Sustainable Destination Management"},description:{el:"Συνεχής παρακολούθηση τουριστικής πυκνότητας, διαχείριση εποχικής κατανομής, ανθεκτικότητα υποδομών και ικανοποίηση επισκεπτών.",en:"Continuous monitoring of visitor density, seasonal load leveling, infrastructure resilience, and visitor experience."}},{badge:{el:"Πυλώνας Β",en:"Pillar B"},title:{el:"Κοινωνικοοικονομική Βιωσιμότητα",en:"Socio-Economic Sustainability"},description:{el:"Ποιοτική απασχόληση, μέση διάρκεια παραμονής, κατά κεφαλήν δαπάνη και στήριξη τοπικών παραγωγών και επιχειρήσεων.",en:"Local employment metrics, length of stay, average daily expenditure, and support for local micro-enterprises."}},{badge:{el:"Πυλώνας C",en:"Pillar C"},title:{el:"Πολιτιστική Βιωσιμότητα & Κληρονομιά",en:"Cultural Sustainability & Heritage"},description:{el:"Προστασία μνημείων UNESCO (Παλαιά Πόλη Κέρκυρας), ροές επισκεπτών σε φρούρια και διατήρηση της άυλης πολιτιστικής ταυτότητας.",en:"Preservation of UNESCO heritage sites (Corfu Old Town), visitor throughput in historic fortresses, and intangible cultural preservation."}},{badge:{el:"Πυλώνας D",en:"Pillar D"},title:{el:"Περιβαλλοντική Βιωσιμότητα",en:"Environmental Sustainability"},description:{el:"Ποιότητα αέρα, υδάτινοι πόροι, θαλάσσιο περιβάλλον, διαχείριση αποβλήτων και προστασία οικοτόπων Natura 2000.",en:"Air quality indices, water network balance, coastal marine quality, solid waste recycling, and Natura 2000 biodiversity protection."}}]}]},{id:"03-copernicus-sentinel-earth-observation",slug:"copernicus-sentinel-earth-observation",type:"research",category:"environment",featured:!1,date:{el:"04 Νοεμβρίου 2026",en:"November 4, 2026",iso:"2026-11-04"},location:{el:"Κέρκυρα",en:"Corfu, Greece"},author:{el:"Εργαστήριο Γεωχωρικών Δεδομένων Ιονίου Πανεπιστημίου",en:"Ionian University Geospatial Data Laboratory"},readTime:{el:"4 λεπτά ανάγνωσης",en:"4 min read"},tags:{el:["Copernicus","Sentinel-2","Ποσειδωνία","Θολότητα Υδάτων","CAMS","CMEMS"],en:["Copernicus","Sentinel-2","Posidonia","Water Turbidity","CAMS","CMEMS"]},title:{el:"Δορυφορική Παρατήρηση Γης Copernicus & Sentinel-2 στο IonianDTwin",en:"Copernicus & Sentinel-2 Earth Observation Integration in IonianDTwin"},subtitle:{el:"Πώς η δορυφορική τηλεπισκόπηση προστατεύει τα παράκτια ύδατα και τα λιβάδια Ποσειδωνίας",en:"How satellite remote sensing monitors coastal waters and protects Posidonia meadows"},excerpt:{el:"Πώς τα πολυφασματικά δεδομένα των ευρωπαϊκών δορυφόρων Sentinel τροφοδοτούν τη λίμνη δεδομένων για τον εντοπισμό θολερότητας και την προστασία των λιβαδιών Ποσειδωνίας.",en:"How multi-spectral imagery from European Sentinel satellites powers the data lake to detect coastal turbidity and protect vulnerable Posidonia meadows."},lead:{el:"Το σύστημα IonianDTwin αξιοποιεί την ευρωπαϊκή υποδομή Copernicus Data Space για συνεχή λήψη και επεξεργασία δορυφορικών δεδομένων υψηλής χωρικής και φασματικής ανάλυσης σε ολόκληρο το Ιόνιο Πέλαγος.",en:"IonianDTwin integrates the European Copernicus Data Space infrastructure for continuous processing and ingestion of high-resolution satellite Earth Observation datasets across the Ionian archipelago."},sections:[{title:{el:"Δορυφορικές Υπηρεσίες & Ροές Δεδομένων",en:"Satellite Services & Data Pipelines"},paragraphs:{el:["Η συνδυασμένη επεξεργασία των δορυφορικών δεδομένων με τους επίγειους αισθητήρες επιτρέπει τον έγκαιρο εντοπισμό περιβαλλοντικών ανωμαλιών, όπως η αύξηση της θολερότητας σε ευαίσθητους κόλπους ή η υποβάθμιση της ποιότητας του αέρα κατά τις τουριστικές αιχμές."],en:["Cross-calibrating satellite telemetry with ground sensors enables prompt detection of environmental anomalies, including coastal turbidity spikes in fragile bays and air quality degradation during peak visitor periods."]},cards:[{badge:{el:"Ατμόσφαιρα",en:"Atmosphere"},title:{el:"Copernicus CAMS",en:"Copernicus CAMS"},description:{el:"Συνεχής παρακολούθηση συγκεντρώσεων αιωρούμενων σωματιδίων (PM2.5, PM10), διοξειδίου του αζώτου (NO2) και επιφανειακού όζοντος (O3).",en:"Continuous tracking of particulate matter (PM2.5, PM10), nitrogen dioxide (NO2), and tropospheric ozone (O3)."}},{badge:{el:"Θάλασσα",en:"Marine"},title:{el:"Copernicus CMEMS",en:"Copernicus CMEMS"},description:{el:"Θαλάσσια τηλεμετρία, θερμοκρασία επιφάνειας θάλασσας (SST), συγκέντρωση χλωροφύλλης-a και παράκτια θαλάσσια ρεύματα.",en:"Marine telemetry, Sea Surface Temperature (SST), Chlorophyll-a concentration, and coastal circulation currents."}},{badge:{el:"Τηλεπισκόπηση",en:"Remote Sensing"},title:{el:"Sentinel-2 MSI",en:"Sentinel-2 MSI"},description:{el:"Πολυφασματικοί δείκτες NDVI και NDWI για την καταγραφή δασικής υγείας, βλάστησης και παράκτιας θολερότητας (NTU).",en:"Multi-spectral NDVI and NDWI vegetation and moisture indices for forest vigor and coastal turbidity proxies."}}]}]},{id:"04-ai-rag-natural-language-interface",slug:"ai-rag-natural-language-interface",type:"technology",category:"technology",featured:!1,date:{el:"28 Νοεμβρίου 2026",en:"November 28, 2026",iso:"2026-11-28"},location:{el:"Κέρκυρα",en:"Corfu, Greece"},author:{el:"Ομάδα Ανάπτυξης ΤΝ IonianDTwin",en:"IonianDTwin AI Development Team"},readTime:{el:"6 λεπτά ανάγνωσης",en:"6 min read"},tags:{el:["Τεχνητή Νοημοσύνη","LLM","RAG Pipeline","Natural Language","PostGIS"],en:["Artificial Intelligence","LLM","RAG Pipeline","Natural Language","PostGIS"]},title:{el:"Διεπαφή Φυσικής Γλώσσας και RAG: Δημοκρατικοποίηση της Γεωχωρικής Πληροφορίας",en:"Natural Language Interface and RAG: Democratizing Geospatial Intelligence"},subtitle:{el:"Από τα πολύπλοκα συστήματα GIS στην άμεση τεκμηριωμένη απάντηση",en:"From complex GIS datasets to instant, evidence-grounded insights"},excerpt:{el:"Πώς το μοντέλο Τεχνητής Νοημοσύνης επιτρέπει σε φορείς και πολίτες να υποβάλλουν απλές ερωτήσεις και να λαμβάνουν άμεσες, τεκμηριωμένες απαντήσεις από το ψηφιακό δίδυμο.",en:"How the Retrieval-Augmented Generation (RAG) AI engine empowers policymakers and citizens to query complex geospatial data in plain language."},lead:{el:"Η πρωτοποριακή διεπαφή φυσικής γλώσσας (LLM Query Interface) του IonianDTwin γεφυρώνει το χάσμα ανάμεσα στις εξειδικευμένες χωρικές βάσεις δεδομένων και στους υπεύθυνους λήψης αποφάσεων, επιτρέποντας ερωτήσεις σε απλά Ελληνικά και Αγγλικά.",en:"IonianDTwin's innovative natural language interface (LLM) bridges the divide between complex spatial databases and executive decision-makers, allowing queries in natural Greek and English."},sections:[{title:{el:"Πώς Λειτουργεί ο Αγωγός RAG",en:"How the RAG Pipeline Works"},paragraphs:{el:["Ο χρήστης υποβάλλει οποιοδήποτε ερώτημα σχετικά με τη βιωσ     <script>
      /* Apply the saved palette + language before first paint to avoid a flash. */
      (function () {
        try {
          var p = localStorage.getItem("ioniandtwin.palette");
          var map = {
            ionian: { c: "#F4F7F6", i: "#1E221D", d: "#161915" },
            mono: { c: "#FFFFFF", i: "#000000", d: "#101010" },
            ocean: { c: "#F5F8FA", i: "#0A1930", d: "#1E221D" },
          };
          var v = map[p] || map.ionian;
          var s = document.documentElement.style;
          s.setProperty("--color-cream", v.c);
          s.setProperty("--color-ink", v.i);
          s.setProperty("--color-ink2", v.d);
        } catch (e) {}
      })();
    </script>
